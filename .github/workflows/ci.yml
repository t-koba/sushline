          diff -u .github/scripts/history-full-crlf.expected /tmp/history_full_crlf_entries.out
          grep -qx 'timestamp_0_hex=2331373030303030303030' /tmp/history_full_crlf_timestamped_mode0.out
          grep -qx 'timestamp_2_hex=2331373030303030303031' /tmp/history_full_crlf_timestamped_mode0.out
          grep -qx 'timestamp_0_hex=2331373030303030303030' /tmp/history_full_crlf_timestamped_mode1.out
          grep -qx 'timestamp_1_hex=2331373030303030303031' /tmp/history_full_crlf_timestamped_mode1.out
          printf '#1700000000\none\000hidden\n#1700000001\nnext\000tail\nfinal\n' > /tmp/history_full_nul_timestamped
          /tmp/history_full_probe /tmp/history_full_nul_timestamped | tee /tmp/history_full_nul_timestamped.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_timestamped.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_count=3' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_0=one' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_1=next' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_2=final' /tmp/history_full_nul_timestamped.out
          # Compare a NUL-bearing final command with and without its LF.
          printf 'one\nignored\000tail' > /tmp/history_full_nul_eof_unterminated
          /tmp/history_full_probe /tmp/history_full_nul_eof_unterminated | tee /tmp/history_full_nul_eof_unterminated.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_eof_unterminated.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_eof_unterminated.out
          printf 'one\nignored\000tail\n' > /tmp/history_full_nul_eof_terminated
          /tmp/history_full_probe /tmp/history_full_nul_eof_terminated | tee /tmp/history_full_nul_eof_terminated.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_eof_terminated.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_eof_terminated.out
          {
            printf '[unterminated-final-line]\n'
            cat /tmp/history_full_nul_eof_unterminated.out
            printf '[final-LF-control]\n'
            cat /tmp/history_full_nul_eof_terminated.out
          } > /tmp/history_full_nul_eof.out
          # A NUL inside the timestamp metadata line is measured separately:
          # retain each entry's raw/parsed timestamp and the command list.
          printf '#1700000000\000suffix\nalpha\nbeta\n' > /tmp/history_timestamp_nul
          /tmp/history_full_probe /tmp/history_timestamp_nul --timestamp | tee /tmp/history_timestamp_nul.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_timestamp_nul.out
          grep -qx 'read_history_status=ok' /tmp/history_timestamp_nul.out
          grep -qx 'entry_count=2' /tmp/history_timestamp_nul.out
          grep -qx 'history_comment_char=0' /tmp/history_timestamp_nul.out
          grep -qx 'timestamp_0_hex=2331373030303030303030' /tmp/history_timestamp_nul.out
          grep -qx 'parsed_time_0=0' /tmp/history_timestamp_nul.out
          grep -Eq '^timestamp_1_hex=23(3[0-9])+$' /tmp/history_timestamp_nul.out
          grep -qx 'parsed_time_1=0' /tmp/history_timestamp_nul.out
          grep -qx 'entry_0=alpha' /tmp/history_timestamp_nul.out
          grep -qx 'entry_1=beta' /tmp/history_timestamp_nul.out
          # Run the Rust fixture verbatim so the measured GNU result is
          # compared with the current library baseline, not a second copy of
          # expected Rust behavior embedded in this workflow.
          cargo test -p sushline-history --test history \
            late_timestamp_line_is_command_text_in_an_untimestamped_file \
            -- --exact --nocapture 2>&1 | tee /tmp/history_rust_full_late_record.out
          python3 - <<'PYCOMPARE' | tee /tmp/history_full_file_comparison.out
          import json
          from pathlib import Path

          rust_lines = []
          for line in Path("/tmp/history_rust_full_late_record.out").read_text().splitlines():
              marker = "RUST_BASELINE|"
              if marker in line:
                  value = line.split(marker, 1)[1]
                  if value.startswith("entry_count=") or value.startswith("entry_"):
                      rust_lines.append(value)

          gnu_lines = []
          for line in Path("/tmp/history_full_late_record.out").read_text().splitlines():
              if line.startswith("entry_count=") or line.startswith("entry_"):
                  gnu_lines.append(line)

          def validate_entries(label, lines):
              if not lines or not lines[0].startswith("entry_count="):
                  raise SystemExit(f"missing {label} entry count")
              try:
                  count = int(lines[0].split("=", 1)[1])
              except ValueError as error:
                  raise SystemExit(f"invalid {label} entry count: {lines[0]}") from error
              if count < 0 or len(lines) != count + 1:
                  raise SystemExit(f"incomplete {label} entry list: {lines}")
              if any(line.split("=", 1)[0] != f"entry_{index - 1}"
                     for index, line in enumerate(lines[1:], start=1)):
                  raise SystemExit(f"unordered {label} entry list: {lines}")

          validate_entries("Rust", rust_lines)
          validate_entries("pinned GNU", gnu_lines)
          comparison = "match" if rust_lines == gnu_lines else "different"
          print("history_full_file_comparison=" + json.dumps({
              "result": comparison,
              "rust_entries": rust_lines,
              "gnu_entries": gnu_lines,
          }, separators=(",", ":")))
          PYCOMPARE
      - name: Measure the pinned release's history timestamp rule
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The compatibility row's timestamp claim rests on how GNU's own
          # timestamp call reads a record, so the measurement is repeated
          # here against the pinned release and the row's claim is checked
          # there. The probe asks the library for the time of an entry
          # whose stored record carries the marker, which is the behavior
          # the row describes.
          cat > /tmp/history_time_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <readline/history.h>

          static long entry_time(void) {
              HIST_ENTRY **entries = history_list();
              if (entries == NULL || entries[0] == NULL)
                  return -1;
              return (long) history_get_time(entries[0]);
          }

          static void set_record(const char *record) {
              clear_history();
              add_history("echo hi");
              add_history_time(record);
          }

          int main(void) {
              using_history();
              history_comment_char = '#';
              set_record("#1700000000");
              printf("marker_matches: %ld\n", entry_time());
              history_comment_char = '!';
              printf("marker_differs: %ld\n", entry_time());
              history_comment_char = '#';
              set_record("#\v1700000000");
              printf("vertical_tab: %ld\n", entry_time());
              set_record("#99999999999999999999");
              printf("does_not_fit: %ld\n", entry_time());
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked
          # which library answered the calls. The runpath is written as the
          # older DT_RPATH, which a dependency inherits, so the pinned
          # readline library's own history dependency is resolved inside
          # the prefix and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_time_probe /tmp/history_time_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the check repeats an observation made elsewhere.
          # The loader's report has to name the pinned prefix for the
          # libraries that carry the history code, and to name nothing else
          # for them either, so a call answered by the image's history
          # library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_time_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the timestamp probe loaded no readline or history library" >&2
            exit 1
          fi
          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the timestamp probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          # The rule the row records: a record whose marker matches the
          # library's comment character carries its seconds, the same
          # record carries none once the character no longer matches, the
          # number is read the way the C library's conversion reads it,
          # and a value the conversion cannot hold carries none.
          /tmp/history_time_probe | tee /tmp/history_time.out
          grep -qx 'marker_matches: 1700000000' /tmp/history_time.out
          grep -qx 'marker_differs: 0' /tmp/history_time.out
          grep -qx 'vertical_tab: 1700000000' /tmp/history_time.out
          grep -qx 'does_not_fit: 0' /tmp/history_time.out
      - name: Measure pinned history total bytes
        run: bash .github/scripts/history-total-bytes.sh
      - name: Measure pinned History multiline imports under a limit
        run: bash .github/scripts/history-multiline-limit.sh primary
      - name: Measure pinned History joined imports at EOF
        run: bash .github/scripts/history-joined-eof.sh primary
      - name: Measure pinned history file-import cursors
        run: bash .github/scripts/history-import-cursor.sh
      - name: Measure the pinned release's history positions and search arguments
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The compatibility rows record how the history library numbers its
          # entries and in which order it reads the two integers of
          # history_search_pos, so the measurement is repeated here against
          # the pinned release and the rows' claims are checked there.
          cat > /tmp/history_position_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <readline/history.h>

          static const char *entry_at(int position) {
              HIST_ENTRY *entry = history_get(position);
              return entry ? entry->line : "(null)";
          }

          static void seed_history(void) {
              add_history("alpha");
              add_history("beta");
              add_history("alpha gamma");
          }

          static int measure_append_position(const char *name) {
              int position;
              if (strcmp(name, "middle") == 0)
                  position = 1;
              else if (strcmp(name, "end") == 0)
                  position = 3;
              else
                  return 2;

              using_history();
              seed_history();
              int positioned = history_set_pos(position);
              HIST_ENTRY *before = current_history();
              if (positioned != 1 || where_history() != position)
                  return 3;
              if ((position == 1 && (!before || strcmp(before->line, "beta") != 0)) ||
                  (position == 3 && before != NULL))
                  return 4;

              printf("fixture: %s\n", name);
              printf("before_position: %d\n", where_history());
              printf("before_current: %s\n", before ? before->line : "(null)");
              add_history("delta");
              printf("after_length: %d\n", history_length);
              printf("after_position: %d\n", where_history());
              HIST_ENTRY *after = current_history();
              printf("after_current: %s\n", after ? after->line : "(null)");
              HIST_ENTRY *previous = previous_history();
              printf("previous_entry: %s\n", previous ? previous->line : "(null)");
              printf("after_previous_position: %d\n", where_history());
              return 0;
          }

          static int measure_fresh_appends(void) {
              static const char *lines[] = {"alpha", "beta", "alpha gamma", "delta"};
              static const char *labels[] = {"alpha", "beta", "gamma", "delta"};
              using_history();
              printf("initial_length: %d\n", history_length);
              printf("initial_position: %d\n", where_history());
              HIST_ENTRY *initial = current_history();
              printf("initial_current: %s\n", initial ? initial->line : "(null)");
              for (size_t index = 0; index < sizeof(lines) / sizeof(lines[0]); ++index) {
                  add_history(lines[index]);
                  HIST_ENTRY *current = current_history();
                  printf("after_%s_length: %d\n", labels[index], history_length);
                  printf("after_%s_position: %d\n", labels[index], where_history());
                  printf("after_%s_current: %s\n", labels[index], current ? current->line : "(null)");
              }
              HIST_ENTRY *previous = previous_history();
              printf("previous_entry: %s\n", previous ? previous->line : "(null)");
              printf("after_previous_position: %d\n", where_history());
              return 0;
          }

          static void print_stifled_snapshot(const char *fixture, const char *stage) {
              HIST_ENTRY **list = history_list();
              int pos = where_history();
              HIST_ENTRY *current = pos >= 0 && pos < history_length ? list[pos] : NULL;
              printf("%s %s: length=%d position=%d first=%s second=%s current=%s\n",
                     fixture, stage, history_length, where_history(),
                     history_length > 0 ? list[0]->line : "(null)",
                     history_length > 1 ? list[1]->line : "(null)",
                     current ? current->line : "(null)");
          }

          static int measure_stifled(const char *fixture) {
              using_history();
              if (strcmp(fixture, "stifle0") == 0 || strcmp(fixture, "stifle1") == 0) {
                  stifle_history(fixture[6] - '0');
                  add_history("alpha");
                  print_stifled_snapshot(fixture, "alpha");
                  add_history("beta");
                  print_stifled_snapshot(fixture, "beta");
              } else if (strcmp(fixture, "stifle1-end") == 0) {
                  add_history("alpha");
                  add_history("beta");
                  add_history("gamma");
                  stifle_history(1);
                  if (!history_set_pos(1))
                      return 3;
                  print_stifled_snapshot(fixture, "before");
                  add_history("delta");
                  print_stifled_snapshot(fixture, "after");
              } else if (strcmp(fixture, "stifle2-seq") == 0) {
                  stifle_history(2);
                  add_history("alpha");
                  print_stifled_snapshot(fixture, "alpha");
                  add_history("beta");
                  print_stifled_snapshot(fixture, "beta");
                  add_history("gamma");
                  print_stifled_snapshot(fixture, "gamma");
              } else if (strncmp(fixture, "stifle2-", 8) == 0 &&
                         strlen(fixture) == 9 && fixture[8] >= '0' && fixture[8] <= '2') {
                  int position = fixture[8] - '0';
                  add_history("alpha");
                  add_history("beta");
                  add_history("gamma");
                  stifle_history(2);
                  if (!history_set_pos(position))
                      return 3;
                  print_stifled_snapshot(fixture, "before");
                  add_history("delta");
                  print_stifled_snapshot(fixture, "after");
              } else {
                  return 2;
              }
              HIST_ENTRY *previous = previous_history();
              printf("%s previous: position=%d entry=%s\n", fixture, where_history(),
                     previous ? previous->line : "(null)");
              return 0;
          }

          static int measure_preserved(int limit, int pos) {
              using_history();
              add_history("alpha"); add_history("beta"); add_history("gamma");
              if (!history_set_pos(pos)) return 3;
              stifle_history(limit);
              print_stifled_snapshot("preserve", "stifle");
              HISTORY_STATE *state = history_get_history_state();
              printf("preserve state: offset=%d length=%d\n", state->offset, state->length);
              history_set_pos(0);
              history_set_history_state(state);
              printf("preserve restored: offset=%d length=%d\n", where_history(), history_length);
              free(state);
              add_history("delta");
              print_stifled_snapshot("preserve", "append");
              return 0;
          }

          static int measure_removal(int pos, int index, int stifled) {
              using_history();
              add_history("A"); add_history("B"); add_history("C"); add_history("D");
              if (!history_set_pos(pos)) return 3;
              if (stifled) stifle_history(2);
              HIST_ENTRY *removed = remove_history(index);
              if (!removed) return 4;
              int after = where_history();
              HIST_ENTRY *current = after >= 0 && after < history_length ? current_history() : NULL;
              HIST_ENTRY **list = history_list();
              printf("stifled=%d start=%d remove=%d removed=%s position=%d length=%d current=%s list=",
                     stifled, pos, index, removed->line, after, history_length,
                     current ? current->line : "(null)");
              for (int i = 0; i < history_length; ++i)
                  printf("%s%s", i ? "," : "", list[i]->line);
              putchar('\n');
              free_history_entry(removed);
              return 0;
          }

          static int measure_replacement(int pos, int index, int stifled) {
              using_history();
              add_history("A"); add_history("B"); add_history("C"); add_history("D");
              if (!history_set_pos(pos)) return 3;
              if (stifled) stifle_history(2);
              if (where_history() != pos) return 4;
              HIST_ENTRY *old = replace_history_entry(index, "R", NULL);
              int after = where_history();
              HIST_ENTRY *current = after >= 0 && after < history_length ? current_history() : NULL;
              HIST_ENTRY **list = history_list();
              printf("stifled=%d start=%d replace=%d old=%s position=%d length=%d current=%s list=",
                     stifled, pos, index, old ? old->line : "(null)", after, history_length,
                     current ? current->line : "(null)");
              for (int i = 0; i < history_length; ++i)
                  printf("%s%s", i ? "," : "", list[i]->line);
              putchar('\n');
              if (old) free_history_entry(old);
              return 0;
          }

          static int measure_unstifle(int limit, int pos) {
              using_history();
              add_history("A"); add_history("B"); add_history("C"); add_history("D");
              if (!history_set_pos(pos)) return 3;
              stifle_history(limit);
              int result = unstifle_history();
              int after = where_history();
              HIST_ENTRY *current = after >= 0 && after < history_length ? current_history() : NULL;
              HIST_ENTRY **list = history_list();
              printf("limit=%d start=%d result=%d stifled=%d position=%d length=%d current=%s list=",
                     limit, pos, result, history_is_stifled(), after, history_length,
                     current ? current->line : "(null)");
              for (int i = 0; i < history_length; ++i)
                  printf("%s%s", i ? "," : "", list[i]->line);
              putchar('\n');
              return 0;
          }

          static int measure_set_pos(int count, int start, int target) {
              using_history();
              if (count) { add_history("A"); add_history("B"); add_history("C"); }
              else { add_history("A"); clear_history(); } /* Initialized empty history. */
              if (!history_set_pos(start) || where_history() != start) return 3;
              int result = history_set_pos(target);
              int after = where_history();
              HIST_ENTRY *current = after >= 0 && after < history_length ? current_history() : NULL;
              printf("count=%d start=%d target=%d result=%d position=%d current=%s\n",
                     count, start, target, result, after, current ? current->line : "(null)");
              return 0;
          }

          static int measure_navigation(const char *direction, int start) {
              using_history();
              add_history("A"); add_history("B"); add_history("C");
              if (start < 0 || start > history_length ||
                  !history_set_pos(start) || where_history() != start) return 3;
              HIST_ENTRY *entry;
              if (strcmp(direction, "previous") == 0) entry = previous_history();
              else if (strcmp(direction, "next") == 0) entry = next_history();
              else return 2;
              printf("direction=%s start=%d entry=%s position=%d\n",
                     direction, start, entry ? entry->line : "(null)", where_history());
              return 0;
          }

          static int measure_search_pos(void) {
              static const struct {
                  const char *name, *needle;
                  int direction, pos;
              } cases[] = {
                  {"pos0_previous", "needle", -1, 0},
                  {"pos0_next", "needle", 1, 0},
                  {"pos3_previous", "needle", -1, 3},
                  {"pos3_next_miss", "needle", 1, 3},
                  {"pos99_previous_fallback", "needle", -1, 99},
                  {"pos99_next_fallback", "needle", 1, 99},
                  {"pos99_previous_miss", "missing", -1, 99},
              };
              using_history();
              add_history("needle first"); add_history("middle"); add_history("needle last");
              if (!history_set_pos(1) || where_history() != 1) return 3;
              for (size_t i = 0; i < sizeof(cases) / sizeof(cases[0]); ++i) {
                  int before = where_history();
                  int result = history_search_pos(cases[i].needle, cases[i].direction, cases[i].pos);
                  int after = where_history();
                  printf("case=%s before=%d result=%d after=%d\n", cases[i].name, before, result, after);
              }
              return 0;
          }

          static int measure_clear(int limit, int pos) {
              using_history();
              add_history("A"); add_history("B"); add_history("C"); add_history("D");
              if (!history_set_pos(pos)) return 3;
              if (limit >= 0) stifle_history(limit);
              if (where_history() != pos) return 4;
              clear_history();
              printf("limit=%d start=%d position=%d length=%d stifled=%d\n",
                     limit, pos, where_history(), history_length, !!history_is_stifled());
              return 0;
          }

          int main(int argc, char **argv) {
              if (argc == 2 && strcmp(argv[1], "search-pos") == 0)
                  return measure_search_pos();
              if (argc == 4 && strcmp(argv[1], "navigate") == 0)
                  return measure_navigation(argv[2], atoi(argv[3]));
              if (argc == 5 && strcmp(argv[1], "set-pos") == 0)
                  return measure_set_pos(atoi(argv[2]), atoi(argv[3]), atoi(argv[4]));
              if (argc == 4 && strcmp(argv[1], "clear") == 0)
                  return measure_clear(atoi(argv[2]), atoi(argv[3]));
              if (argc == 4 && strcmp(argv[1], "unstifle") == 0)
                  return measure_unstifle(atoi(argv[2]), atoi(argv[3]));
              if (argc == 5 && strcmp(argv[1], "replace") == 0)
                  return measure_replacement(atoi(argv[2]), atoi(argv[3]), atoi(argv[4]));
              if (argc == 5 && strcmp(argv[1], "remove") == 0)
                  return measure_removal(atoi(argv[2]), atoi(argv[3]), atoi(argv[4]));
              if (argc == 4 && strcmp(argv[1], "preserve") == 0)
                  return measure_preserved(atoi(argv[2]), atoi(argv[3]));
              if (argc == 2 && strncmp(argv[1], "stifle", 6) == 0)
                  return measure_stifled(argv[1]);
              if (argc == 2 && strcmp(argv[1], "init") == 0)
                  return measure_fresh_appends();
              if (argc == 2)
                  return measure_append_position(argv[1]);
              if (argc != 1)
                  return 2;

              using_history();
              seed_history();
              printf("get_zero: %s\n", entry_at(0));
              printf("get_one: %s\n", entry_at(1));
              printf("get_two: %s\n", entry_at(2));
              /* The two integers are read as the direction first and the
                 position second: a negative in the second slot searches
                 backwards from the position the third slot names. */
              printf("backwards_from_first: %d\n", history_search_pos("gamma", -1, 0));
              printf("forwards_from_first: %d\n", history_search_pos("gamma", 0, 0));
              printf("from_first: %d\n", history_search_pos("alpha", 1, 0));
              printf("from_second: %d\n", history_search_pos("alpha", 1, 1));
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked
          # which library answered the calls. The runpath is written as the
          # older DT_RPATH, which a dependency inherits, so the pinned
          # readline library's own history dependency is resolved inside
          # the prefix and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_position_probe /tmp/history_position_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the check repeats an observation made elsewhere.
          # The loader's report has to name the pinned prefix for the
          # libraries that carry the history code, and to name nothing else
          # for them either, so a call answered by the image's history
          # library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_position_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the position probe loaded no readline or history library" >&2
            exit 1
