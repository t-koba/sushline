      - name: Measure direct-library SIGINT handling against the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The SIGINT row describes the direct Readline library, not the Bash
          # builtin: call readline() directly in a program linked to the exact
          # pinned release. The PTY probe measures caller-handler, SIG_DFL
          # and SIG_IGN cases; the assertions below pin their exact outcomes.
          cat > /tmp/readline_sigint_probe.c <<'PROBE'
          #include <stdio.h>
          #include <readline/readline.h>
          #include <signal.h>
          #include <stdlib.h>
          #include <string.h>

          extern int rl_readline_version;
          static volatile sig_atomic_t signal_count;

          static void application_sigint(int signal_number) {
              if (signal_number == SIGINT)
                  signal_count++;
          }

          int main(void) {
              const char *disposition = getenv("SUSHLINE_SIGINT_DISPOSITION");
              if (disposition == NULL ||
                  (strcmp(disposition, "caller-handler") != 0 &&
                   strcmp(disposition, "default") != 0 &&
                   strcmp(disposition, "ignored") != 0))
                  return 2;
              if (strcmp(disposition, "caller-handler") == 0 ||
                  strcmp(disposition, "ignored") == 0) {
                  struct sigaction action;
                  memset(&action, 0, sizeof action);
                  action.sa_handler = strcmp(disposition, "ignored") == 0
                      ? SIG_IGN : application_sigint;
                  sigemptyset(&action.sa_mask);
                  if (sigaction(SIGINT, &action, NULL) != 0)
                      return 1;
                  if (strcmp(disposition, "ignored") == 0) {
                      struct sigaction current;
                      if (sigaction(SIGINT, NULL, &current) != 0)
                          return 1;
                      fprintf(stderr, "pre_sigint_ignored=%d\n",
                              current.sa_handler == SIG_IGN);
                  }
              }
              fprintf(stderr, "sigint_disposition=%s\n", disposition);
              fprintf(stderr, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              fflush(stderr);
              char *line = readline("sigint> ");
              if (line == NULL) {
                  fprintf(stderr, "result=null signal_count=%d\n", (int)signal_count);
              } else {
                  fprintf(stderr, "result_len=%zu signal_count=%d\n", strlen(line),
                          (int)signal_count);
                  fprintf(stderr, "result_hex=");
                  for (const unsigned char *p = (const unsigned char *)line; *p; p++)
                      fprintf(stderr, "%02x", *p);
                  fprintf(stderr, "\n");
                  free(line);
              }
              if (strcmp(disposition, "ignored") == 0) {
                  struct sigaction action;
                  if (sigaction(SIGINT, NULL, &action) != 0)
                      return 1;
                  fprintf(stderr, "post_sigint_ignored=%d\n",
                          action.sa_handler == SIG_IGN);
              }
              fprintf(stderr, "done\n");
              fflush(stderr);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_sigint_probe /tmp/readline_sigint_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          # The probe has to load the pinned library, not the image's version.
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_sigint_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the SIGINT probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the SIGINT probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          # Each disposition gets a fresh child with a controlling PTY. Send
          # the same partial line, Ctrl-C and suffix bytes. Pin all three
          # direct-library outcomes, including SIG_IGN preservation. Bounded
          # waits and cleanup apply independently to all runs.
          python3 - <<'PYPROBE' | tee /tmp/readline_sigint.out
          import os
          import pty
          import select
          import signal
          import time

          probe = "/tmp/readline_sigint_probe"
          expected = os.environ["READLINE_ORACLE_VERSION"]

          def measure(disposition):
              print(f"measurement_disposition={disposition}")
              pid, master = pty.fork()
              if pid == 0:
                  signal.signal(signal.SIGINT, signal.SIG_DFL)
                  env = os.environ.copy()
                  env["INPUTRC"] = "/dev/null"
                  env["LC_ALL"] = "C"
                  env["TERM"] = "dumb"
                  env["SUSHLINE_SIGINT_DISPOSITION"] = disposition
                  os.execve(probe, [probe], env)

              transcript = bytearray()
              status = None

              def poll_child():
                  nonlocal status
                  if status is None:
                      try:
                          waited, child_status = os.waitpid(pid, os.WNOHANG)
                      except ChildProcessError:
                          return status
                      if waited:
                          status = child_status
                  return status

              def read_until(marker, timeout):
                  deadline = time.monotonic() + timeout
                  while marker not in transcript and time.monotonic() < deadline:
                      if poll_child() is not None:
                          break
                      ready, _, _ = select.select([master], [], [], 0.1)
                      if ready:
                          try:
                              transcript.extend(os.read(master, 4096))
                          except OSError:
                              break
                  return marker in transcript

              try:
                  if not read_until(b"sigint> ", 3.0):
                      raise SystemExit(f"{disposition}: probe did not display its prompt")
                  os.write(master, b"abc")
                  if not read_until(b"abc", 2.0):
                      raise SystemExit(f"{disposition}: probe did not display partial line")
                  os.write(master, b"\x03X\r")
                  read_until(b"done\n", 5.0)
                  exit_deadline = time.monotonic() + 1.0
                  while poll_child() is None and time.monotonic() < exit_deadline:
                      time.sleep(0.01)
                  timeout_label = (
                      "ignored_observation_timeout" if disposition == "ignored"
                      else "observation_timeout"
                  )
                  if poll_child() is None:
                      print(f"{timeout_label}=1")
                      os.killpg(pid, signal.SIGKILL)
                      _, status = os.waitpid(pid, 0)
                  else:
                      print(f"{timeout_label}=0")
                  returncode = (
                      os.waitstatus_to_exitcode(status) if status is not None else "unknown"
                  )
                  print(f"readline_expected={expected} returncode={returncode} "
                        f"transcript_len={len(transcript)} transcript_hex={transcript.hex()}")
                  if f"sigint_disposition={disposition}".encode() not in transcript:
                      raise SystemExit(f"{disposition}: disposition missing from probe output")
                  if f"readline_release={expected}".encode() not in transcript:
                      raise SystemExit(f"{disposition}: expected pinned release {expected}")
              finally:
                  if poll_child() is None:
                      try:
                          os.killpg(pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      try:
                          _, status = os.waitpid(pid, 0)
                      except ChildProcessError:
                          pass
                  try:
                      os.close(master)
                  except OSError:
                      pass

          for disposition in ("caller-handler", "default", "ignored"):
              measure(disposition)
          PYPROBE
          # Pin the exact SIG_IGN transcript measured by the pinned 8.3
          # probe, including its pre/post disposition and returned line.
          grep -Fqx 'measurement_disposition=caller-handler' /tmp/readline_sigint.out
          grep -Fqx 'measurement_disposition=default' /tmp/readline_sigint.out
          grep -Fqx 'measurement_disposition=ignored' /tmp/readline_sigint.out
          test "$(grep -Fxc 'observation_timeout=0' /tmp/readline_sigint.out)" -eq 2
          grep -Fqx 'ignored_observation_timeout=0' /tmp/readline_sigint.out
          grep -Fqx 'readline_expected=8.3 returncode=0 transcript_len=129 transcript_hex=736967696e745f646973706f736974696f6e3d63616c6c65722d68616e646c65720d0a726561646c696e655f72656c656173653d382e330d0a736967696e743e206162635e43580d0a726573756c745f6c656e3d34207369676e616c5f636f756e743d310d0a726573756c745f6865783d36313632363335380d0a646f6e650d0a' /tmp/readline_sigint.out
          grep -Fqx 'readline_expected=8.3 returncode=-2 transcript_len=63 transcript_hex=736967696e745f646973706f736974696f6e3d64656661756c740d0a726561646c696e655f72656c656173653d382e330d0a736967696e743e206162635e43' /tmp/readline_sigint.out
          grep -Fqx 'readline_expected=8.3 returncode=0 transcript_len=165 transcript_' /tmp/readline_sigint.out
      - name: Measure direct-library SIGWINCH chaining against the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # First pinned measurement only: this sends SIGWINCH directly, not
          # a terminal resize, and makes no redisplay or Bash builtin claim.
          cat > /tmp/readline_sigwinch_probe.c <<'PROBE'
          #include <stdio.h>
          #include <readline/readline.h>
          #include <signal.h>
          #include <stdlib.h>
          #include <string.h>

          extern int rl_readline_version;
          static volatile sig_atomic_t signal_count;
          static int wrapper_observed;
          static int line_seeded;
          static int callback_observed;

          static void application_sigwinch(int signal_number) {
              if (signal_number == SIGWINCH)
                  signal_count++;
          }

          static int observe_active_handler(void) {
              struct sigaction current;
              if (!wrapper_observed && sigaction(SIGWINCH, NULL, &current) == 0 &&
                  current.sa_handler != application_sigwinch) {
                  wrapper_observed = 1;
                  fprintf(stderr, "active_winch_wrapper=1\n");
                  fflush(stderr);
              }
              if (wrapper_observed && !line_seeded) {
                  /* The line is a controlled preexisting buffer, not PTY input. */
                  rl_replace_line("abcX", 0);
                  line_seeded = 1;
                  fprintf(stderr, "line_buffer_seeded=1\n");
                  fflush(stderr);
              }
              if (!callback_observed && signal_count != 0) {
                  callback_observed = 1;
                  /* End the fixture from normal event-loop context after the
                     saved handler has run; do not depend on more PTY input. */
                  rl_done = 1;
                  fprintf(stderr, "application_callback_marker=1\n");
                  fflush(stderr);
              }
              return 0;
          }

          int main(void) {
              struct sigaction action;
              memset(&action, 0, sizeof action);
              action.sa_handler = application_sigwinch;
              sigemptyset(&action.sa_mask);
              if (sigaction(SIGWINCH, &action, NULL) != 0)
                  return 1;
              rl_event_hook = observe_active_handler;
              fprintf(stderr, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              fflush(stderr);
              char *line = readline("winch> ");
              if (line == NULL) {
                  fprintf(stderr, "result=null\n");
              } else {
                  fprintf(stderr, "result_len=%zu\n", strlen(line));
                  fprintf(stderr, "result_hex=");
                  for (const unsigned char *p = (const unsigned char *)line; *p; p++)
                      fprintf(stderr, "%02x", *p);
                  fprintf(stderr, "\n");
                  free(line);
              }
              fprintf(stderr, "signal_count=%d\n", (int)signal_count);
              fprintf(stderr, "wrapper_observed=%d\n", wrapper_observed);
              fprintf(stderr, "line_seeded=%d\n", line_seeded);
              fprintf(stderr, "callback_observed=%d\n", callback_observed);
              if (sigaction(SIGWINCH, NULL, &action) != 0)
                  return 1;
              fprintf(stderr, "post_winch_application_handler=%d\n",
                      action.sa_handler == application_sigwinch);
              fprintf(stderr, "done\n");
              fflush(stderr);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_sigwinch_probe /tmp/readline_sigwinch_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_sigwinch_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the SIGWINCH probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the SIGWINCH probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          python3 - <<'PYPROBE' | tee /tmp/readline_sigwinch.out
          import os
          import pty
          import select
          import signal
          import time

          probe = "/tmp/readline_sigwinch_probe"
          expected = os.environ["READLINE_ORACLE_VERSION"]
          pid, master = pty.fork()
          if pid == 0:
              env = os.environ.copy()
              env["INPUTRC"] = "/dev/null"
              env["LC_ALL"] = "C"
              env["TERM"] = "dumb"
              os.execve(probe, [probe], env)

          transcript = bytearray()
          status = None
          observation_timeout = False
          signal_sent = False
          line_seeded_marker_seen = False
          callback_marker_seen = False

          def poll_child():
              global status
              if status is None:
                  waited, child_status = os.waitpid(pid, os.WNOHANG)
                  if waited:
                      status = child_status
              return status

          def read_until(marker, timeout):
              deadline = time.monotonic() + timeout
              while marker not in transcript and time.monotonic() < deadline:
                  ready, _, _ = select.select([master], [], [], 0.1)
                  if ready:
                      try:
                          data = os.read(master, 4096)
                      except OSError:
                          break
                      if not data:
                          break
                      transcript.extend(data)
              return marker in transcript

          try:
              if not read_until(b"winch> ", 3.0):
                  observation_timeout = poll_child() is None
                  raise SystemExit("SIGWINCH probe did not display its prompt")
              # PTYs translate LF to CRLF: do not include a newline in the
              # readiness marker. Absence is a measurement, not an assertion
              # about 8.3; never count an application handler alone as chaining.
              wrapper_ready = read_until(b"active_winch_wrapper=1", 3.0)
              print(f"wrapper_marker_seen={int(wrapper_ready)}")
              # The program seeds a known active line buffer in its event hook;
              # only signal after its marker, without relying on PTY echo/input.
              if wrapper_ready:
                  line_seeded_marker_seen = read_until(b"line_buffer_seeded=1", 3.0)
                  if line_seeded_marker_seen:
                      time.sleep(0.05)
                      os.kill(pid, signal.SIGWINCH)
                      signal_sent = True
                  else:
                      os.write(master, b"abcX\r")
              else:
                  # Even without a wrapper, finish and measure the absence safely.
                  os.write(master, b"abcX\r")
              if signal_sent:
                  callback_marker_seen = read_until(
                      b"application_callback_marker=1", 1.0
                  )
                  if not callback_marker_seen:
                      # Permit a bounded return even if the callback or the
                      # follow-up event hook was not observed.
                      os.write(master, b"\r")
              done = read_until(b"done", 5.0)
              exit_deadline = time.monotonic() + 1.0
              while poll_child() is None and time.monotonic() < exit_deadline:
                  time.sleep(0.01)
              observation_timeout = poll_child() is None
              if observation_timeout:
                  raise SystemExit("SIGWINCH probe did not exit within the deadline")
              if os.waitstatus_to_exitcode(status) != 0 or not done:
                  raise SystemExit("SIGWINCH probe did not complete successfully")
              if f"readline_release={expected}\r\n".encode() not in transcript:
                  raise SystemExit(f"SIGWINCH probe expected pinned release {expected}")
              # No exact transcript, callback count, wrapper or restoration
              # assertions until this pinned measurement has been inspected.
          finally:
              if poll_child() is None:
                  try:
                      os.killpg(pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  try:
                      _, status = os.waitpid(pid, 0)
                  except ChildProcessError:
                      pass
              returncode = (
                  os.waitstatus_to_exitcode(status) if status is not None else "unknown"
              )
              print(f"sigwinch_sent={int(signal_sent)}")
              print(f"line_buffer_seeded_marker_seen={int(line_seeded_marker_seen)}")
              print(f"application_callback_marker_seen={int(callback_marker_seen)}")
              print(f"observation_timeout={int(observation_timeout)}")
              print(f"readline_expected={expected} returncode={returncode} "
                    f"transcript_len={len(transcript)} transcript_hex={transcript.hex()}")
              try:
                  os.close(master)
              except OSError:
                  pass
          PYPROBE
      - name: Run the oracle suite
        run: |
          set -euo pipefail
          export PATH="$HOME/.cache/sushline/bash-oracle/bin:$PATH"
          bash --version
          # The oracle output is not captured, so the notes a case prints
          # when it reports nothing on a host with another release are in the
          # job log.
          cargo test --locked -p sushline-readline --test oracle --test bind_golden -- --nocapture 2>&1 | tee /tmp/oracle.log
          # The host must carry the release the claims name, or the cases
          # scoped to that release would report nothing.
          grep -q "carrying Readline $READLINE_ORACLE_VERSION" /tmp/oracle.log
      - name: Collect pinned oracle measurement reports
        if: always()
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/sushline-oracle-measurements"
          mkdir -p "$report_dir"
          for report in \
            /tmp/readline_termios.out \
            /tmp/readline_sigint.out \
            /tmp/readline_sigwinch.out \
            /tmp/history_range_per_line.out \
            /tmp/history_range_joined.out \
            /tmp/history_range_plain_joined.out \
            /tmp/history_range_late_record.out \
            /tmp/history_range_blank_lines.out \
            /tmp/history_range_blank_lines_joined.out \
            /tmp/history_range_plain_blank_lines.out \
            /tmp/history_range_plain_blank_lines_joined.out \
            /tmp/history_range_blank_line_edges_timestamped.out \
            /tmp/history_range_blank_line_edges_plain.out \
            /tmp/history_range_blank_line_edges_joined_timestamped.out \
            /tmp/history_range_blank_line_edges_joined_plain.out \
            /tmp/history_range_edge_timestamped.out \
            /tmp/history_range_edge_plain.out \
            /tmp/history_range_oob_timestamped.out \
            /tmp/history_range_oob_plain.out \
            /tmp/history_full_late_record.out \
            /tmp/history_full_blank_timestamped_mode0.out \
            /tmp/history_full_blank_timestamped_mode1.out \
            /tmp/history_full_blank_plain_mode0.out \
            /tmp/history_full_blank_plain_mode1.out \
            /tmp/history_full_nul_plain.out \
