                  printf("\n");
                  free(word);
              } else {
                  printf("(null)\n");
              }
              fflush(stdout);
              clear_history();
              add_history(input);
              char *selector = strdup("!!:1");
              if (selector == NULL) {
                  printf("%s_expand11: status=dup-failed output_hex=(null)\n", label);
                  return;
              }
              char *expanded = NULL;
              int status = history_expand(selector, &expanded);
              printf("%s_expand11: status=%d output_hex=", label, status);
              if (expanded != NULL) {
                  print_hex_bytes(expanded);
                  printf("\n");
                  free(expanded);
              } else {
