                  current.sa_handler != SIG_DFL && current.sa_handler != SIG_IGN;
              fprintf(stderr, "active_quit_wrapper=%d\n", wrapper_observed);
              fprintf(stderr, "active_quit_ignored=%d\n",
                      current.sa_handler == SIG_IGN);
              fprintf(stderr, "active_quit_default=%d\n",
                      current.sa_handler == SIG_DFL);
              fprintf(stderr, "active_quit_application_handler=%d\n",
                      current.sa_handler == application_sigquit);
