      - name: Measure direct-library SIGINT handling against the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The SIGINT row describes the direct Readline library, not the Bash
          # builtin: call readline() directly in a program linked to the exact
          # pinned release. The PTY probe measures caller-handler, SIG_DFL
          # and SIG_IGN cases; the assertions below pin their exact outcomes.
          cat > /tmp/readline_sigint_probe.c <<'PROBE'
          #include <stdio.h>
          #include <readline/readline.h>
          #include <signal.h>
          #include <stdlib.h>
          #include <string.h>

          extern int rl_readline_version;
          static volatile sig_atomic_t signal_count;

          static void application_sigint(int signal_number) {
              if (signal_number == SIGINT)
                  signal_count++;
          }

          int main(void) {
              const char *disposition = getenv("SUSHLINE_SIGINT_DISPOSITION");
              if (disposition == NULL ||
                  (strcmp(disposition, "caller-handler") != 0 &&
                   strcmp(disposition, "default") != 0 &&
                   strcmp(disposition, "ignored") != 0))
                  return 2;
              if (strcmp(disposition, "caller-handler") == 0 ||
                  strcmp(disposition, "ignored") == 0) {
                  struct sigaction action;
                  memset(&action, 0, sizeof action);
                  action.sa_handler = strcmp(disposition, "ignored") == 0
                      ? SIG_IGN : application_sigint;
                  sigemptyset(&action.sa_mask);
                  if (sigaction(SIGINT, &action, NULL) != 0)
                      return 1;
                  if (strcmp(disposition, "ignored") == 0) {
                      struct sigaction current;
                      if (sigaction(SIGINT, NULL, &current) != 0)
                          return 1;
                      fprintf(stderr, "pre_sigint_ignored=%d\n",
                              current.sa_handler == SIG_IGN);
                  }
              }
              fprintf(stderr, "sigint_disposition=%s\n", disposition);
              fprintf(stderr, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              fflush(stderr);
              char *line = readline("sigint> ");
              if (line == NULL) {
                  fprintf(stderr, "result=null signal_count=%d\n", (int)signal_count);
              } else {
                  fprintf(stderr, "result_len=%zu signal_count=%d\n", strlen(line),
                          (int)signal_count);
                  fprintf(stderr, "result_hex=");
                  for (const unsigned char *p = (const unsigned char *)line; *p; p++)
                      fprintf(stderr, "%02x", *p);
                  fprintf(stderr, "\n");
                  free(line);
              }
              if (strcmp(disposition, "ignored") == 0) {
                  struct sigaction action;
                  if (sigaction(SIGINT, NULL, &action) != 0)
                      return 1;
                  fprintf(stderr, "post_sigint_ignored=%d\n",
                          action.sa_handler == SIG_IGN);
              }
              fprintf(stderr, "done\n");
              fflush(stderr);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_sigint_probe /tmp/readline_sigint_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          # The probe has to load the pinned library, not the image's version.
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_sigint_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the SIGINT probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the SIGINT probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          # Each disposition gets a fresh child with a controlling PTY. Send
          # the same partial line, Ctrl-C and suffix bytes. Pin all three
          # direct-library outcomes, including SIG_IGN preservation. Bounded
          # waits and cleanup apply independently to all runs.
          python3 - <<'PYPROBE' | tee /tmp/readline_sigint.out
          import os
          import pty
          import select
          import signal
          import time

          probe = "/tmp/readline_sigint_probe"
          expected = os.environ["READLINE_ORACLE_VERSION"]

          def measure(disposition):
              print(f"measurement_disposition={disposition}")
