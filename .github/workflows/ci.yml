              /tmp/history_position_probe set-pos 3 "$pos" 4
            done
            /tmp/history_position_probe set-pos 0 0 0
            /tmp/history_position_probe set-pos 0 0 1
          } | tee /tmp/history_position_set_pos.out
          diff -u .github/scripts/history-position-set-pos.expected /tmp/history_position_set_pos.out
          # Each call starts in a fresh A/B/C history at or before the end.
          # Do not query current_history or navigate from beyond-end offsets.
          {
            for direction in previous next; do
              for pos in 0 1 2 3; do
                /tmp/history_position_probe navigate "$direction" "$pos"
              done
            done
          } | tee /tmp/history_position_navigation.out
          diff -u .github/scripts/history-position-navigation.expected /tmp/history_position_navigation.out
          # Search from explicit and invalid positions while the cursor is in range.
          /tmp/history_position_probe search-pos | tee /tmp/history_position_search_pos.out
          diff -u .github/scripts/history-position-search-pos.expected /tmp/history_position_search_pos.out
      - name: Measure and assert pinned History expansion fixtures
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # Direct-library probe against the pinned history library: the
          # fixtures mirror `history_expansion_answers_match_the_measured_c_library`
          # and the quick-substitution suffix shape in
          # `quick_substitution_processes_suffix_modifiers_and_further_expansion`,
          # plus bounded lexical word cases for the five extended-glob-shaped
          # prefixes `@(`, `!(`, `?(`, `+(`, `*(` and nested, quoted, escaped,
          # command-substitution, process-substitution, and arithmetic
          # controls. Each lexical case reports `history_tokenize` tokens,
          # `history_arg_extract(1, 1, input)`, and `!!:1` expansion on the
          # seeded entry, all as hex.
          # The probe prints the 8.3 library's answer per fixture as a stable
          # label, the `history_expand` return status and the output bytes in
          # hex, so quoting and errors stay unambiguous. The artifact retains
          # the measurement; exact checks below cover the direct expansion and
          # bounded lexical cases paired with Rust regressions. The lexical
          # cases test History word handling, not shell parsing or glob
          # expansion; these are not Bash builtin or public C ABI claims.
          cat > /tmp/history_expand_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <readline/history.h>

          static void run(const char *label, const char *input) {
              clear_history();
              add_history("echo previous");
              add_history("echo a b");
              add_history("echo a b");
              char *in = strdup(input);
              if (in == NULL) {
                  printf("%s: status=dup-failed output_hex=(null)\n", label);
                  return;
              }
              char *output = NULL;
              int status = history_expand(in, &output);
              printf("%s: status=%d output_hex=", label, status);
              if (output != NULL) {
                  for (const unsigned char *p = (const unsigned char *)output; *p; p++) {
                      printf("%02x", *p);
                  }
              } else {
                  printf("(null)");
              }
              printf("\n");
              fflush(stdout);
              free(in);
              free(output);
          }

          static void print_hex_bytes(const char *s) {
              if (s == NULL) {
                  printf("(null)");
                  return;
              }
              for (const unsigned char *p = (const unsigned char *)s; *p; p++) {
                  printf("%02x", *p);
              }
          }

          /* Emit pinned GNU 8.3 lexical observations: tokenize, single-word
             extract, and word-selector expansion on the same seeded entry.
             Each sub-measurement resets the history first, so cases stay
             isolated. The surrounding CI step asserts the exact outputs
             against the matching Rust fixtures. This measures History word
             handling, not shell parsing or glob expansion. */
          static void run_lexical(const char *label, const char *input) {
              clear_history();
              char **tokens = history_tokenize(input);
              printf("%s_tokenize:", label);
              if (tokens == NULL) {
                  printf(" (null)\n");
              } else {
                  int count = 0;
                  while (tokens[count] != NULL) {
                      count++;
                  }
                  printf(" count=%d", count);
                  for (int i = 0; tokens[i] != NULL; i++) {
                      printf(" [%d]=", i);
                      print_hex_bytes(tokens[i]);
                  }
                  printf("\n");
                  for (int i = 0; tokens[i] != NULL; i++) {
                      free(tokens[i]);
                  }
                  free(tokens);
              }
              fflush(stdout);
              clear_history();
              char *word = history_arg_extract(1, 1, input);
              printf("%s_arg11_hex=", label);
              if (word != NULL) {
                  print_hex_bytes(word);
                  printf("\n");
                  free(word);
              } else {
                  printf("(null)\n");
              }
              fflush(stdout);
              clear_history();
              add_history(input);
              char *selector = strdup("!!:1");
              if (selector == NULL) {
                  printf("%s_expand11: status=dup-failed output_hex=(null)\n", label);
                  return;
              }
              char *expanded = NULL;
              int status = history_expand(selector, &expanded);
              printf("%s_expand11: status=%d output_hex=", label, status);
              if (expanded != NULL) {
                  print_hex_bytes(expanded);
                  printf("\n");
                  free(expanded);
              } else {
                  printf("(null)\n");
              }
              fflush(stdout);
              free(selector);
          }

          int main(void) {
              using_history();
              run("event_bang_bang", "!!");
              run("last_word", "!$");
              run("word_zero", "!:0");
              run("head_modifier", "!!:h");
              run("tail_modifier", "!!:t");
              run("root_modifier", "!!:r");
              run("extension_modifier", "!!:e");
              run("quote_modifier", "!!:q");
              run("single_quote_context", "echo '!!");
              run("print_only_modifier", "!!:p");
              run("quote_each", "!!:x");
              run("substitute", "!!:s/b/B/");
              run("relative", "!-2");
              run("quick_suffix", "^a^A^ trailing");
              run("literal_caret_prefix", "echo ^a^b");
              run("unknown_modifier", "!!:u");
              run("missing_event", "!nonexistent");
              run_lexical("lex_at", "echo @(a b) z");
              run_lexical("lex_bang", "echo !(a b) z");
              run_lexical("lex_ques", "echo ?(a b) z");
              run_lexical("lex_plus", "echo +(a b) z");
              run_lexical("lex_star", "echo *(a b) z");
              run_lexical("lex_nested", "echo @((a b) c) z");
              run_lexical("lex_quoted", "echo '@(a b)' z");
              run_lexical("lex_escaped", "echo \\@(a b) z");
              run_lexical("lex_dollar_paren", "echo $(a b) z");
              run_lexical("lex_process_subst", "echo <(a b) z");
              run_lexical("lex_arith", "echo $((1 + 2)) z");
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked
          # which library answered the calls. The runpath is written as the
          # older DT_RPATH, which a dependency inherits, so the pinned
          # readline library's own history dependency is resolved inside
          # the prefix and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_expand_probe /tmp/history_expand_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the measurement repeats an observation made
          # elsewhere. The loader's report has to name the pinned prefix
          # for the libraries that carry the history code, and to name
          # nothing else for them either, so a call answered by the image's
          # history library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_expand_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the expansion probe loaded no readline or history library" >&2
            exit 1
          fi
          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the expansion probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          # Retain the complete measurement, then assert selected direct-
          # library results paired with Rust history-expansion regressions.
          # Expected values come from pinned GNU History 8.3, not 8.2 inference.
          /tmp/history_expand_probe | tee /tmp/history_expand.out
          while IFS= read -r expected; do
            grep -Fqx "$expected" /tmp/history_expand.out || {
