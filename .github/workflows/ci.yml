      - name: Upload pinned oracle measurement reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-readline-${{ env.READLINE_ORACLE_VERSION }}-measurements
          path: ${{ runner.temp }}/sushline-oracle-measurements/
          if-no-files-found: warn
          retention-days: 14
