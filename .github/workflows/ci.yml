            done
            for pos in 0 1 2 3 4; do
              /tmp/history_position_probe unstifle 2 "$pos"
            done
          } | tee /tmp/history_position_unstifle.out
          diff -u .github/scripts/history-position-unstifle.expected /tmp/history_position_unstifle.out
          # Fresh processes; do not navigate or query current_history after clear.
          {
            for pos in 0 1 2 3 4; do
              /tmp/history_position_probe clear -1 "$pos"
            done
            for pos in 1 4; do
              /tmp/history_position_probe clear 2 "$pos"
