      - name: Measure the pinned release's history timestamp rule
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The compatibility row's timestamp claim rests on how GNU's own
          # timestamp call reads a record, so the measurement is repeated
          # here against the pinned release and the row's claim is checked
          # there. The probe asks the library for the time of an entry
          # whose stored record carries the marker, which is the behavior
          # the row describes.
          cat > /tmp/history_time_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <readline/history.h>

          static long entry_time(void) {
              HIST_ENTRY **entries = history_list();
              if (entries == NULL || entries[0] == NULL)
                  return -1;
              return (long) history_get_time(entries[0]);
          }

          static void set_record(const char *record) {
              clear_history();
              add_history("echo hi");
              add_history_time(record);
          }

          int main(void) {
              using_history();
              history_comment_char = '#';
              set_record("#1700000000");
              printf("marker_matches: %ld\n", entry_time());
              history_comment_char = '!';
              printf("marker_differs: %ld\n", entry_time());
              history_comment_char = '#';
              set_record("#\v1700000000");
              printf("vertical_tab: %ld\n", entry_time());
              set_record("#99999999999999999999");
              printf("does_not_fit: %ld\n", entry_time());
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked
          # which library answered the calls. The runpath is written as the
          # older DT_RPATH, which a dependency inherits, so the pinned
          # readline library's own history dependency is resolved inside
          # the prefix and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_time_probe /tmp/history_time_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the check repeats an observation made elsewhere.
          # The loader's report has to name the pinned prefix for the
          # libraries that carry the history code, and to name nothing else
          # for them either, so a call answered by the image's history
          # library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_time_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the timestamp probe loaded no readline or history library" >&2
            exit 1
          fi
          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the timestamp probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          # The rule the row records: a record whose marker matches the
          # library's comment character carries its seconds, the same
          # record carries none once the character no longer matches, the
          # number is read the way the C library's conversion reads it,
          # and a value the conversion cannot hold carries none.
