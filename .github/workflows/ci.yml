              grep -qx "readline_release=$READLINE_ORACLE_VERSION" "$report"
              grep -qx "history_multiline_entries=$mode" "$report"
              grep -qx 'read_history_status=ok' "$report"
              grep -qx 'history_comment_char=35' "$report"
              printf '[%s mode%s]\n' "$kind" "$mode" >> /tmp/history_full_crlf_entries.out
              grep '^entry_' "$report" >> /tmp/history_full_crlf_entries.out
