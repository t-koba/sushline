          stifle0 beta: length=0 position=0 first=(null) second=(null) current=(null)
          stifle0 previous: position=0 entry=(null)
          stifle1 alpha: length=1 position=0 first=alpha second=(null) current=alpha
          stifle1 beta: length=1 position=0 first=beta second=(null) current=beta
          stifle1 previous: position=0 entry=(null)
          stifle1-end before: length=1 position=1 first=gamma second=(null) current=(null)
          stifle1-end after: length=1 position=1 first=delta second=(null) current=(null)
          stifle1-end previous: position=0 entry=delta
          stifle2-seq alpha: length=1 position=0 first=alpha second=(null) current=alpha
          stifle2-seq beta: length=2 position=0 first=alpha second=beta current=alpha
          stifle2-seq gamma: length=2 position=0 first=beta second=gamma current=beta
          stifle2-seq previous: position=0 entry=(null)
          stifle2-0 before: length=2 position=0 first=beta second=gamma current=beta
          stifle2-0 after: length=2 position=0 first=gamma second=delta current=gamma
          stifle2-0 previous: position=0 entry=(null)
          stifle2-1 before: length=2 position=1 first=beta second=gamma current=gamma
          stifle2-1 after: length=2 position=1 first=gamma second=delta current=delta
          stifle2-1 previous: position=0 entry=gamma
          stifle2-2 before: length=2 position=2 first=beta second=gamma current=(null)
          stifle2-2 after: length=2 position=2 first=gamma second=delta current=(null)
          stifle2-2 previous: position=1 entry=delta
          EXPECTED
          diff -u /tmp/history_position_stifled.expected /tmp/history_position_stifled.out
          # Never navigate GNU history with an offset beyond its length.
          for args in '0 1' '1 3' '2 3' '4 1'; do
            /tmp/history_position_probe preserve $args | tee -a /tmp/history_position_append.out
          done
          grep '^preserve' /tmp/history_position_append.out > /tmp/history_position_preserved.out
          cat > /tmp/history_position_preserved.expected <<'EXPECTED'
          preserve stifle: length=0 position=1 first=(null) second=(null) current=(null)
          preserve state: offset=1 length=0
          preserve restored: offset=1 length=0
          preserve append: length=0 position=1 first=(null) second=(null) current=(null)
          preserve stifle: length=1 position=3 first=gamma second=(null) current=(null)
          preserve state: offset=3 length=1
          preserve restored: offset=3 length=1
          preserve append: length=1 position=3 first=delta second=(null) current=(null)
          preserve stifle: length=2 position=3 first=beta second=gamma current=(null)
          preserve state: offset=3 length=2
          preserve restored: offset=3 length=2
          preserve append: length=2 position=3 first=gamma second=delta current=(null)
          preserve stifle: length=3 position=1 first=alpha second=beta current=beta
          preserve state: offset=1 length=3
          preserve restored: offset=1 length=3
          preserve append: length=4 position=1 first=alpha second=beta current=beta
          EXPECTED
          diff -u /tmp/history_position_preserved.expected /tmp/history_position_preserved.out
          # A fresh process for each removal; never call current_history beyond the end.
          {
            for pos in 0 1 2 3 4; do
