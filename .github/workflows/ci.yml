      - name: Measure direct-library bracketed paste against the pinned release
        run: |
          set -euo pipefail
          ulimit -c 0
          readline="$HOME/.cache/sushline/readline-oracle"
          # Assert only direct-library results measured in two independent
          # pinned Readline 8.3 reports; this makes no Bash or public-C-ABI claim.
          cat > /tmp/readline_paste_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <readline/readline.h>

          static int report_ready(void) {
              rl_event_hook = NULL;
              fprintf(stderr, "\npaste_hook_ready=1\n");
              fflush(stderr);
              return 0;
          }

          int main(void) {
              fprintf(stderr, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              rl_initialize();
              /* Enable the behavior under measurement, with no inputrc overrides. */
              if (rl_variable_bind("enable-bracketed-paste", "on") != 0)
                  return 1;
              fprintf(stderr, "bracketed_paste_requested=on\n");
              rl_event_hook = report_ready;
              fflush(stderr);
              char *line = readline("paste> ");
              fprintf(stderr, "\nresult_is_null=%d\n", line == NULL);
              if (line != NULL) {
                  fprintf(stderr, "result_len=%zu\nresult_hex=", strlen(line));
                  for (const unsigned char *p = (const unsigned char *)line; *p; p++)
                      fprintf(stderr, "%02x", *p);
                  fprintf(stderr, "\n");
                  free(line);
              }
              fprintf(stderr, "done\n");
              fflush(stderr);
              return 0;
          }
          PROBE
          cc -Wall -Wextra -Werror -o /tmp/readline_paste_probe /tmp/readline_paste_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_paste_probe)
          printf '%s\n' "$loader_report" | tee /tmp/readline_paste.out
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the paste probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the paste probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          python3 - <<'PYPROBE' | tee -a /tmp/readline_paste.out
          import os
          import pty
          import resource
          import select
          import signal
          import time

          probe = "/tmp/readline_paste_probe"
          expected = os.environ["READLINE_ORACLE_VERSION"]
          expected_results = {
              "payload_cr_trial_1": (3, "410a42"),
              "split_terminator_trial_1": (5, "73706c6974"),
              "payload_cr_trial_2": (3, "410a42"),
              "split_terminator_trial_2": (5, "73706c6974"),
          }

          def measure(name, chunks):
              print(f"measurement_case={name}", flush=True)
              print("fixture_term=xterm-256color inputrc=/dev/null locale=C")
              print("signals_sent=none split_settle_seconds=0.2")
              pid, master = pty.fork()
              if pid == 0:
                  try:
                      resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
                      env = os.environ.copy()
                      env.update(INPUTRC="/dev/null", LC_ALL="C", TERM="xterm-256color")
                      os.execve(probe, [probe], env)
                  except Exception as error:
                      os.write(2, f"probe child setup failed: {error}\n".encode())
                  finally:
                      os._exit(127)

              transcript = bytearray()
              status = None
              cleanup_kill_sent = False
              observation_timeout = False
              hook_ready_seen = False
              writes = []

              def poll_child():
                  nonlocal status
                  if status is None:
                      waited, child_status = os.waitpid(pid, os.WNOHANG)
                      if waited:
                          status = child_status
                  return status

              def read_until(marker, timeout):
                  deadline = time.monotonic() + timeout
                  while marker not in transcript:
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          break
                      ready, _, _ = select.select([master], [], [], min(0.05, remaining))
                      if ready:
                          try:
                              data = os.read(master, 4096)
                          except OSError:
                              break
                          if not data:
                              break
                          transcript.extend(data)
                      elif poll_child() is not None:
                          break
                  return marker in transcript

              def wait_for_exit(timeout):
                  deadline = time.monotonic() + timeout
                  while poll_child() is None and time.monotonic() < deadline:
                      time.sleep(0.01)
                  return poll_child() is not None

              def kill_and_reap():
                  nonlocal cleanup_kill_sent
                  if poll_child() is None:
                      try:
                          os.killpg(pid, signal.SIGKILL)
                          cleanup_kill_sent = True
                      except ProcessLookupError:
                          try:
                              os.kill(pid, signal.SIGKILL)
                              cleanup_kill_sent = True
                          except ProcessLookupError:
                              pass
                  if not wait_for_exit(2.0):
                      raise RuntimeError(f"{name}: child not reaped after SIGKILL")

              try:
                  os.set_blocking(master, False)
                  # The event hook runs after terminal preparation, before input.
                  hook_ready_seen = read_until(b"paste_hook_ready=1\r\n", 3.0)
                  if hook_ready_seen:
                      # Separate writes (and a bounded drain/settle) deliberately
                      # split the terminator; the final CR accepts the pasted line.
                      for label, data in chunks + [("accept", b"\r")]:
                          count = "not_written"
                          if poll_child() is None:
                              _, writable, _ = select.select([], [master], [], 1.0)
                              if writable:
                                  try:
                                      count = os.write(master, data)
                                  except OSError as error:
                                      count = f"error_errno_{error.errno}"
                          writes.append((label, data, count))
                          read_until(b"\x00", 0.2)
                  done_seen = read_until(b"done\r\n", 3.0)
                  if not wait_for_exit(1.0):
                      observation_timeout = True
                      kill_and_reap()
                  # Drain remaining bytes even when the child has already exited.
                  read_until(b"\x00", 0.2)
                  returncode = os.waitstatus_to_exitcode(status)
                  print(f"hook_ready_seen={int(hook_ready_seen)}")
                  print(f"done_seen={int(done_seen)}")
                  for index, (label, data, count) in enumerate(writes, 1):
                      print(f"write_{index}_label={label} requested={len(data)} "
                            f"count={count} hex={data.hex()}")
                  print(f"observation_timeout={int(observation_timeout)}")
                  print(f"cleanup_kill_sent={int(cleanup_kill_sent)}")
                  print(f"child_reaped={int(status is not None)}")
                  fields = {}
                  for field in ("readline_release", "bracketed_paste_requested",
                                "result_is_null", "result_len", "result_hex"):
                      marker = field.encode("ascii") + b"="
                      start = transcript.rfind(marker)
                      end = transcript.find(b"\r\n", start) if start >= 0 else -1
                      value = (transcript[start + len(marker):end].decode("ascii")
                               if end >= 0 else "missing")
                      fields[field] = value
                      print(f"child_{field}={value}")
                  print(f"readline_expected={expected} returncode={returncode} "
                        f"transcript_len={len(transcript)} transcript_hex={transcript.hex()}")
                  # Assert probe identity, completion, and the repeated pinned
                  # outcomes established by two independent Readline 8.3 reports.
                  if fields["readline_release"] != expected:
                      raise SystemExit(f"{name}: unexpected Readline release")
                  if fields["bracketed_paste_requested"] != "on":
                      raise SystemExit(f"{name}: bracketed-paste setup did not complete")
                  if not hook_ready_seen:
                      raise SystemExit(f"{name}: probe never became ready")
                  if not done_seen or returncode != 0:
                      raise SystemExit(f"{name}: probe did not complete successfully")
                  if observation_timeout or cleanup_kill_sent:
                      raise SystemExit(f"{name}: observation timed out or required cleanup kill")
                  if any(count != len(data) for _, data, count in writes):
                      raise SystemExit(f"{name}: PTY input write was incomplete")
                  if fields["result_is_null"] != "0":
                      raise SystemExit(f"{name}: Readline returned no line")
                  expected_len, expected_hex = expected_results[name]
                  if fields["result_len"] != str(expected_len):
                      raise SystemExit(f"{name}: unexpected returned-line length")
                  if fields["result_hex"] != expected_hex:
                      raise SystemExit(f"{name}: unexpected returned-line bytes")
                  print("fixture_completed=1", flush=True)
              finally:
                  try:
                      kill_and_reap()
                  finally:
                      os.close(master)

          for trial in (1, 2):
              measure(f"payload_cr_trial_{trial}", [("frame", b"\x1b[200~A\rB\x1b[201~")])
              measure(f"split_terminator_trial_{trial}", [
                  ("frame_and_terminator_prefix", b"\x1b[200~split\x1b[20"),
                  ("terminator_suffix", b"1~"),
              ])
          PYPROBE
      - name: Measure named and unknown-user inputrc includes against the pinned release
        run: |
          set -euo pipefail
          ulimit -c 0
          readline="$HOME/.cache/sushline/readline-oracle"
          # Measurement-only direct-library probe for named-user and
          # nonexistent-user `$include` behavior. The C program initializes
          # the pinned library with no user configuration, then reads one
          # test-owned outer file that includes a test-owned file through a
          # `~user/` spelling, includes a controlled missing-user path, and
          # sets a mode after that include to expose whether parsing continued.
          # The report retains only release, status and state booleans,
          # diagnostic presence, and cleanup fields. This is a direct-library
          # measurement against the pinned release only; it makes no Bash-behavior or
          # public-C-ABI claim and leaves recursive-include cycle handling
          # out of scope.
          cat > /tmp/readline_named_include_probe.c <<'PROBE'
          #include <stdio.h>
          #include <string.h>
          #include <readline/readline.h>

          extern int rl_readline_version;

          int main(int argc, char **argv) {
              if (argc != 2) {
                  return 2;
              }
              printf("readline_release=%d.%d\n", rl_readline_version >> 8,
                     rl_readline_version & 0xff);
              fflush(stdout);
              if (rl_initialize() != 0) {
                  return 1;
              }
              int status = rl_read_init_file(argv[1]);
              printf("read_status=%d\n", status);
              const char *value = rl_variable_value("completion-ignore-case");
              int is_on = value != NULL && strcmp(value, "on") == 0;
              const char *mode = rl_variable_value("editing-mode");
              int is_vi = mode != NULL && strncmp(mode, "vi", 2) == 0;
              printf("completion_ignore_case_on=%d\n", is_on);
              printf("editing_mode_vi=%d\n", is_vi);
              fflush(stdout);
              return 0;
          }
          PROBE
          cc -Wall -Wextra -Werror -o /tmp/readline_named_include_probe \
            /tmp/readline_named_include_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          # The probe has to load the pinned release, not the image's
          # library, or the measurement repeats an observation made elsewhere.
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_named_include_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the named-include probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the named-include probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          # The fixture owns every input file it reads: for each of two
          # trials, one included file under a fresh uniquely named directory
          # in the current account's passwd home, and one outer file in
          # temporary storage that includes it through `~user/`, then attempts
          # a controlled nonexistent-user include before a later mode setting.
          # Reports omit both account names and paths. Each trial runs the
          # probe in a separate subprocess with a 5-second timeout; temporary
          # files are removed in `finally`.
          python3 - <<'PYPROBE' | tee /tmp/readline_named_include.out
          import os
          import pwd
          import resource
          import shutil
          import subprocess
          import tempfile

          # Each trial emits release/status fields, the known-user include
          # result, the post-missing-include mode result, a sanitized stderr
          # presence bit, and probe/cleanup status. Only these bounded fields
          # are reported; raw diagnostics, account names, and paths are not.
          probe = "/tmp/readline_named_include_probe"
          expected = os.environ["READLINE_ORACLE_VERSION"]
          resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
          account = pwd.getpwuid(os.getuid())
          username = account.pw_name
          home = account.pw_dir
          unknown_user = "sushline-no-such-inputrc-user-20261026"
          try:
              pwd.getpwnam(unknown_user)
          except KeyError:
              pass
          else:
              raise SystemExit("the controlled nonexistent-account fixture is unavailable")

          def run_trial(label):
              tempdir = tempfile.mkdtemp(prefix="sushline-named-include-", dir=home)
              outer_path = None
              timed_out = False
              record = {}
              try:
                  relative = os.path.relpath(tempdir, home)
                  included_path = os.path.join(tempdir, "included.inputrc")
                  with open(included_path, "w", encoding="utf-8") as handle:
                      handle.write("set completion-ignore-case on\n")
                  descriptor, outer_path = tempfile.mkstemp(
                      prefix="sushline-named-include-outer-", suffix=".inputrc"
                  )
                  with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                      handle.write(f'$include ~{username}/{relative}/included.inputrc\n')
                      handle.write("set editing-mode emacs\n")
                      handle.write(f'$include ~{unknown_user}/missing.inputrc\n')
                      handle.write("set editing-mode vi\n")
                  env = os.environ.copy()
                  env["INPUTRC"] = "/dev/null"
                  env["LC_ALL"] = "C"
                  env["TERM"] = "dumb"
                  try:
                      completed = subprocess.run(
                          [probe, outer_path],
                          input=b"",
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          env=env,
                          timeout=5,
                      )
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      print(f"{label}_probe_timeout=1")
                      print(f"{label}_fixture_completed=0")
                      record["timeout"] = True
                      record["completed"] = False
                  else:
                      text = completed.stdout.decode("utf-8", "replace")
                      fields = {}
                      for line in text.splitlines():
                          key, separator, value = line.partition("=")
                          if separator and key in {
                              "readline_release",
                              "read_status",
                              "completion_ignore_case_on",
                              "editing_mode_vi",
                          }:
                              fields[key] = value
                      required = {
                          "readline_release",
                          "read_status",
                          "completion_ignore_case_on",
                          "editing_mode_vi",
                      }
                      if fields.keys() != required:
                          raise SystemExit(f"direct-library measurement {label} omitted a result field")
                      if fields["readline_release"] != expected:
                          raise SystemExit(f"direct-library measurement {label} used an unexpected release")
                      print(f"{label}_readline_release={fields['readline_release']}")
                      print(f"{label}_read_status={fields['read_status']}")
                      print(f"{label}_completion_ignore_case_on={fields['completion_ignore_case_on']}")
                      print(f"{label}_editing_mode_vi={fields['editing_mode_vi']}")
                      stderr_nonempty = bool(completed.stderr)
                      print(f"{label}_probe_stderr_nonempty={int(stderr_nonempty)}")
                      print(f"{label}_probe_timeout=0")
                      print(f"{label}_probe_returncode={completed.returncode}")
                      print(f"{label}_fixture_completed={int(completed.returncode == 0)}")
                      record.update(fields)
                      record["returncode"] = completed.returncode
                      record["stderr_nonempty"] = stderr_nonempty
                      record["timeout"] = False
                      record["completed"] = completed.returncode == 0
                      if completed.returncode != 0:
                          raise SystemExit(f"direct-library probe {label} exited unsuccessfully")
              finally:
                  tempdir_removed = False
                  try:
                      shutil.rmtree(tempdir, ignore_errors=True)
                      tempdir_removed = not os.path.exists(tempdir)
                  except Exception:
                      tempdir_removed = False
                  outer_removed = True
                  if outer_path is not None:
                      try:
                          os.unlink(outer_path)
                      except FileNotFoundError:
                          pass
                      except OSError:
                          outer_removed = False
                      else:
                          outer_removed = True
                  print(f"{label}_tempdir_cleanup={int(tempdir_removed)}")
                  print(f"{label}_outer_cleanup={int(outer_removed)}")
                  record["tempdir_cleanup"] = tempdir_removed
                  record["outer_cleanup"] = outer_removed
              if timed_out:
                  raise SystemExit(f"direct-library measurement {label} timed out")
              if not tempdir_removed or not outer_removed:
                  raise SystemExit(f"direct-library measurement {label} cleanup failed")
              return record

          first = run_trial("trial1")
          second = run_trial("trial2")
          for key in (
              "readline_release",
              "read_status",
              "completion_ignore_case_on",
              "editing_mode_vi",
              "stderr_nonempty",
              "returncode",
          ):
              if first[key] != second[key]:
                  raise SystemExit("direct-library named-user trials disagree")
          PYPROBE
