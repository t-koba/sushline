              using_history();
              run("event_bang_bang", "!!");
              run("last_word", "!$");
              run("word_zero", "!:0");
              run("head_modifier", "!!:h");
              run("tail_modifier", "!!:t");
              run("root_modifier", "!!:r");
              run("extension_modifier", "!!:e");
              run("quote_modifier", "!!:q");
              run("single_quote_context", "echo '!!");
              run("print_only_modifier", "!!:p");
              run("quote_each", "!!:x");
              run("substitute", "!!:s/b/B/");
              run("relative", "!-2");
              run("quick_suffix", "^a^A^ trailing");
              run("literal_caret_prefix", "echo ^a^b");
              run("unknown_modifier", "!!:u");
              run("missing_event", "!nonexistent");
              run_lexical("lex_at", "echo @(a b) z");
              run_lexical("lex_bang", "echo !(a b) z");
              run_lexical("lex_ques", "echo ?(a b) z");
              run_lexical("lex_plus", "echo +(a b) z");
              run_lexical("lex_star", "echo *(a b) z");
              run_lexical("lex_nested", "echo @((a b) c) z");
              run_lexical("lex_quoted", "echo '@(a b)' z");
              run_lexical("lex_escaped", "echo \\@(a b) z");
              run_lexical("lex_dollar_paren", "echo $(a b) z");
              run_lexical("lex_process_subst", "echo <(a b) z");
              run_lexical("lex_arith", "echo $((1 + 2)) z");
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked
          # which library answered the calls. The runpath is written as the
          # older DT_RPATH, which a dependency inherits, so the pinned
          # readline library's own history dependency is resolved inside
          # the prefix and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_expand_probe /tmp/history_expand_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the measurement repeats an observation made
          # elsewhere. The loader's report has to name the pinned prefix
          # for the libraries that carry the history code, and to name
          # nothing else for them either, so a call answered by the image's
          # history library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_expand_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the expansion probe loaded no readline or history library" >&2
            exit 1
