      - name: Upload independent pinned inputrc term report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-readline-${{ env.READLINE_ORACLE_VERSION }}-inputrc-term-replica
          path: /tmp/readline_inputrc_term.out
          if-no-files-found: error
          retention-days: 14
      - name: Upload independent pinned inputrc variable RHS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-readline-${{ env.READLINE_ORACLE_VERSION }}-inputrc-variable-rhs-replica
          path: /tmp/readline_inputrc_variable_rhs.out
          if-no-files-found: error
          retention-days: 14
      - name: Download the primary inputrc variable RHS report
        uses: actions/download-artifact@v4
        with:
          name: pinned-readline-${{ env.READLINE_ORACLE_VERSION }}-measurements
          path: ${{ runner.temp }}/sushline-primary-measurements/
      - name: Require primary and fresh-replica inputrc variable RHS agreement
        run: |
          set -euo pipefail
          primary="$RUNNER_TEMP/sushline-primary-measurements/readline_inputrc_variable_rhs.out"
          replica=/tmp/readline_inputrc_variable_rhs.out
          test -f "$primary"
          test -f "$replica"
          grep -qx 'report=primary' "$primary"
          grep -qx 'report=replica' "$replica"
          # Exact raw observations must agree; only the report role differs.
          diff -u <(sed '/^report=/d' "$primary") <(sed '/^report=/d' "$replica")
