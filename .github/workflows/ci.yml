              done
            done
          } | tee /tmp/history_position_replace.out
          diff -u .github/scripts/history-position-replace.expected /tmp/history_position_replace.out
          # Each unstifle case starts fresh; current_history is guarded by length.
          {
            for pos in 0 2 4; do
