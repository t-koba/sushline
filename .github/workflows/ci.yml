          diff -u .github/scripts/history-position-remove.expected /tmp/history_position_remove.out
          # Fresh processes for selected replacements, including invalid indexes and
          # stifled beyond-end offsets; current_history is guarded by length.
          {
            for pos in 0 1 2 4; do
