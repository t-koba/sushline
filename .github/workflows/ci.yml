name: ci

on: [push, pull_request]

env:
  # The oracle host is pinned by digest, not only by URL: the tarball is
  # verified before it is built, and the build is cached under the same
  # digest.
  BASH_ORACLE_VERSION: "5.3"
  BASH_ORACLE_SHA256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba

jobs:
  # The Rust checks do not need the oracle host, so a network fault in the
  # host download cannot hide them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-default-features

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache the pinned bash oracle host
        uses: actions/cache@v4
        with:
          path: ~/.cache/sushline/bash-oracle
          key: bash-${{ runner.os }}-${{ env.BASH_ORACLE_VERSION }}-${{ env.BASH_ORACLE_SHA256 }}
      - name: Install the pinned bash oracle host
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/sushline/bash-oracle"
          if [ ! -x "$prefix/bin/bash" ]; then
            # Bash needs the Readline headers to build the line editor the
            # oracle suite observes. The runner image ships without package
            # lists, so the index is refreshed before the install.
            sudo apt-get update
            sudo apt-get install -y libreadline-dev
            curl -fsSL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 5 \
              --retry-connrefused \
              --retry-delay 2 \
              --retry-max-time 240 \
              -o /tmp/bash-$BASH_ORACLE_VERSION.tar.gz \
              https://ftp.gnu.org/gnu/bash/bash-$BASH_ORACLE_VERSION.tar.gz
            echo "$BASH_ORACLE_SHA256  /tmp/bash-$BASH_ORACLE_VERSION.tar.gz" | sha256sum --check --strict
            tar -xzf /tmp/bash-$BASH_ORACLE_VERSION.tar.gz -C /tmp
            cd /tmp/bash-$BASH_ORACLE_VERSION
            ./configure --prefix="$prefix"
            make -j"$(nproc)"
            make install
          fi
          "$prefix/bin/bash" --version
          # A Bash without Readline would silently produce empty evidence.
          "$prefix/bin/bash" --norc -c 'bind -v' | grep -q '^set editing-mode emacs$'
      - name: Report the installed Readline default
        run: |
          set -euo pipefail
          # The compatibility row's output-stream claim rests on a Readline
          # observation. This probe repeats it against the library the runner
          # installed and checks it, so the claim is verified in CI without a C
          # fixture in the repository. The headers are installed here as well,
          # because the host's cache may already hold the built Bash.
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
          cat > /tmp/readline_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          extern char *readline(const char *);

          int main(void) {
              FILE *report = fopen("/tmp/readline_probe.report", "w");
              if (!report) {
                  return 1;
              }
              setvbuf(report, NULL, _IONBF, 0);
              freopen("/tmp/readline_probe.out", "w", stdout);
              freopen("/tmp/readline_probe.err", "w", stderr);
              char *line = readline("probe> ");
              free(line);
              fflush(stdout);
              fflush(stderr);
              char buffer[512];
              size_t read = 0;
              FILE *out = fopen("/tmp/readline_probe.out", "r");
              if (out) {
                  read = fread(buffer, 1, sizeof(buffer) - 1, out);
                  fclose(out);
              }
              buffer[read] = '\0';
              fprintf(report, "prompt_in_stdout=%d\n", strstr(buffer, "probe>") != NULL);
              fclose(report);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_probe /tmp/readline_probe.c -lreadline
          echo "" | /tmp/readline_probe || true
          cat /tmp/readline_probe.report
          dpkg-query -W -f='readline_package_version=${Version}\n' libreadline-dev
          # The claim: the library writes its prompt to standard output.
          grep -qx 'prompt_in_stdout=1' /tmp/readline_probe.report
      - name: Run the oracle suite
        run: |
          set -euo pipefail
          export PATH="$HOME/.cache/sushline/bash-oracle/bin:$PATH"
          bash --version
          cargo test --locked -p sushline-readline --test oracle --test bind_golden
