name: ci

on: [push, pull_request]

env:
  # The oracle host is the unpatched Bash 5.3 release (patchlevel 0): CI
  # builds this pinned tarball without applying later standalone patches.
  # It is pinned by digest, not only by URL, and cached under that digest.
  BASH_ORACLE_VERSION: "5.3"
  BASH_ORACLE_SHA256: 0d5cd86965f869a26cf64f4b71be7b96f90a3ba8b3d74e27e8e9d9d5550f31ba
  # The Readline release the oracle host is built against. It is the release
  # the compatibility document names, so the cases that are scoped to that
  # release run in the job instead of reporting nothing.
  READLINE_ORACLE_VERSION: "8.3"
  # The digest of the Readline tarball. The Bash tarball is pinned by
  # digest, and so is this one, so the fetch is a checked one.
  READLINE_ORACLE_SHA256: fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc
  # The configuration the pinned release is built with: the option the
  # build passes to the release's configure. The option asks the release to
  # link its shared library against the terminal-capability library the
  # build finds, so the built library carries that dependency itself
  # instead of leaving it to the program that links it. The pinned Bash
  # host loads that library, and the host's configure has to find the
  # terminal functions through it. The configuration is part of the
  # identity of the evidence, so it is named in the cache keys: a cached
  # library that was built with another configuration is not reused as the
  # pinned one. The value carries no space, because the cache key carries
  # it.
  READLINE_ORACLE_CONFIGURE_FLAGS: "--with-shared-termcap-library"
  # The Readline the pinned Bash host is linked against. Bash carries its
  # own copy of Readline and builds that by default, so the host is
  # configured to use the installed release. The value chooses the linkage
  # the build carries, and it is named in the cache key as well: a cached
  # host that was built another way is not reused as the pinned one, and a
  # value the build does not know stops the job.
  BASH_ORACLE_READLINE: "installed"

jobs:
  # The Rust checks do not need the oracle host, so a network fault in the
  # host download cannot hide them.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-default-features

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache the pinned Readline release
        uses: actions/cache@v4
        with:
          path: ~/.cache/sushline/readline-oracle
          key: readline-${{ runner.os }}-${{ env.READLINE_ORACLE_VERSION }}-${{ env.READLINE_ORACLE_SHA256 }}-${{ env.READLINE_ORACLE_CONFIGURE_FLAGS }}-configure-accepted-v1
      - name: Cache the pinned bash oracle host
        uses: actions/cache@v4
        with:
          path: ~/.cache/sushline/bash-oracle
          key: bash-${{ runner.os }}-${{ env.BASH_ORACLE_VERSION }}-${{ env.BASH_ORACLE_SHA256 }}-${{ env.READLINE_ORACLE_VERSION }}-${{ env.READLINE_ORACLE_SHA256 }}-${{ env.READLINE_ORACLE_CONFIGURE_FLAGS }}-${{ env.BASH_ORACLE_READLINE }}
      - name: Install the pinned Readline release
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/sushline/readline-oracle"
          # The configuration the build is configured with is part of the
          # identity of the evidence, so it is recorded next to the library
          # it built. A cached library that was built with another
          # configuration is rebuilt, so the job never measures a build it
          # did not configure.
          marker="$prefix/build-configuration"
          configure_flags=(--prefix="$prefix" "$READLINE_ORACLE_CONFIGURE_FLAGS")
          # This identity prevents a cached build from before the configure
          # acceptance check from being reused as if it had passed the check.
          configure_identity="configure-accepted-v1 ${configure_flags[*]}"
          recorded=""
          if [ -f "$marker" ]; then
            recorded=$(cat "$marker")
          fi
          if [ ! -f "$prefix/lib/libreadline.so" ] || [ "$recorded" != "$configure_identity" ]; then
            # This build needs the terminal-capability headers and library. The
            # runner image ships without package lists, so the index is
            # refreshed before the install.
            sudo apt-get update
            sudo apt-get install -y libncurses-dev
            curl -fsSL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 5 \
              --retry-connrefused \
              --retry-delay 2 \
              --retry-max-time 240 \
              -o /tmp/readline-$READLINE_ORACLE_VERSION.tar.gz \
              https://ftp.gnu.org/gnu/readline/readline-$READLINE_ORACLE_VERSION.tar.gz
            echo "$READLINE_ORACLE_SHA256  /tmp/readline-$READLINE_ORACLE_VERSION.tar.gz" | sha256sum --check --strict
            tar -xzf /tmp/readline-$READLINE_ORACLE_VERSION.tar.gz -C /tmp
            cd /tmp/readline-$READLINE_ORACLE_VERSION
            # The prefix the job installs into, and the options the
            # configuration names. The configuration is part of the
            # evidence's identity, because the oracle compares redisplay
            # bytes, so the build is configured with the named options
            # instead of the release's defaults, and the library it comes
            # out with is checked after the build.
            # The configuration the job names is the configuration the
            # build is given, and a configure that does not recognize an
            # option reports it and carries on, so the configure's own
            # report is checked and a build that ignored an option stops
            # the job.
            ./configure "${configure_flags[@]}" 2>&1 | tee /tmp/readline_configure.log
            if grep -q 'unrecognized options' /tmp/readline_configure.log; then
              echo "the pinned Readline configure did not accept: ${configure_flags[*]}" >&2
              exit 1
            fi
            make -j"$(nproc)"
            make install
            # The configuration the library was built with is recorded, so
            # the next run knows which build it is looking at.
            printf '%s\n' "$configure_identity" > "$marker"
          fi
          echo "readline_configuration=${configure_flags[*]}"
          echo "readline_configure_check=configure-accepted-v1"
          # The release the compatibility document names is the release the
          # library carries, so a build of another release cannot pass as
          # the pinned one.
          cat > /tmp/readline_release.c <<'PROBE'
          #include <stdio.h>

          extern int rl_readline_version;

          int main(void) {
              printf("%d.%d\n", rl_readline_version >> 8, rl_readline_version & 0xff);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_release /tmp/readline_release.c \
            -L"$prefix/lib" -Wl,-rpath,"$prefix/lib" -lreadline
          release=$(/tmp/readline_release)
          echo "readline_release=$release"
          test "$release" = "$READLINE_ORACLE_VERSION"
          # The terminal library the built library was linked against is
          # part of the evidence's identity, so the build is checked to
          # link a terminal-capability library. A build that came out
          # without one is named and stops the job. The release links
          # whichever of them its own detection found, so the check accepts
          # the family and the job log names the one that was linked.
          #
          # The loader is a shell script of its own, and the shell that runs
          # this step exports the options it runs with, which makes that
          # script fail on a variable it leaves unset, so the loader is
          # asked without them.
          loader_report=$(env -u SHELLOPTS ldd "$prefix/lib/libreadline.so")
          echo "$loader_report"
          if ! printf '%s\n' "$loader_report" | grep -E 'libtinfo|libncurses|libtermcap'; then
            echo "the pinned Readline build did not link a terminal-capability library" >&2
            exit 1
          fi
      - name: Install the pinned bash oracle host
        run: |
          set -euo pipefail
          prefix="$HOME/.cache/sushline/bash-oracle"
          readline="$HOME/.cache/sushline/readline-oracle"
          # The host's line editor is the pinned Readline release, so the
          # headers the build needs come with that release and the runner
          # image's own library is not installed here. The terminal-capability
          # library used by the pinned Readline build is still needed.
          sudo apt-get update
          sudo apt-get install -y libncurses-dev
          # The linkage the configuration names is the linkage the build
          # carries, so the configuration decides the flags the configure
          # is given. A value the build does not know stops the job, so a
          # host is never built with a linkage the configuration does not
          # name.
          case "$BASH_ORACLE_READLINE" in
            installed)
              readline_flags=(--with-installed-readline="$readline")
              ;;
            *)
              echo "unknown BASH_ORACLE_READLINE: $BASH_ORACLE_READLINE" >&2
              exit 1
              ;;
          esac
          echo "bash_readline_selection=$BASH_ORACLE_READLINE"
          if [ ! -x "$prefix/bin/bash" ]; then
            curl -fsSL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 5 \
              --retry-connrefused \
              --retry-delay 2 \
              --retry-max-time 240 \
              -o /tmp/bash-$BASH_ORACLE_VERSION.tar.gz \
              https://ftp.gnu.org/gnu/bash/bash-$BASH_ORACLE_VERSION.tar.gz
            echo "$BASH_ORACLE_SHA256  /tmp/bash-$BASH_ORACLE_VERSION.tar.gz" | sha256sum --check --strict
            tar -xzf /tmp/bash-$BASH_ORACLE_VERSION.tar.gz -C /tmp
            cd /tmp/bash-$BASH_ORACLE_VERSION
            # The host is linked against the pinned release, and the path to
            # it is carried in the host's own image, so the oracle suite
            # finds the release the host carries. Bash carries its own copy
            # of Readline in lib/readline and builds that by default, so the
            # installed release is asked for by name; the prefix tells the
            # configure where to find it.
            ./configure --prefix="$prefix" \
              "${readline_flags[@]}" \
              CPPFLAGS="-I$readline/include" \
              LDFLAGS="-L$readline/lib -Wl,-rpath,$readline/lib"
            make -j"$(nproc)"
            make install
          fi
          "$prefix/bin/bash" --version
          # A Bash without Readline would silently produce empty evidence.
          "$prefix/bin/bash" --norc -c 'bind -v' | grep -q '^set editing-mode emacs$'
          # The host must load the pinned release, or the cases scoped to it
          # would report nothing. A host that carries another release is
          # named and stops the job.
          if ! env -u SHELLOPTS ldd "$prefix/bin/bash" | grep -F "$readline/lib/libreadline"; then
            echo "the pinned bash host does not load the pinned Readline release" >&2
            exit 1
          fi
          # The two names the 8.3 release adds belong to the library's
          # command table, and the host that loads the pinned release is
          # where the library's command list appears, so the check asks
          # that host rather than searching the library's bytes.
          for command in execute-named-command export-completions; do
            "$prefix/bin/bash" --norc -c 'bind -l' | tr ' ' '\n' | grep -qx "$command"
          done
      - name: Report the installed Readline default
        run: |
          set -euo pipefail
          # The compatibility row's output-stream claim rests on a Readline
          # observation on the 8.2 release. This probe repeats it against the
          # library the runner image installed and checks it, so the claim is
          # verified in CI without a C fixture in the repository. That
          # library is not the one the oracle host loads: the host carries
          # the pinned release, and the row's claim is the one that was
          # measured on the image's release.
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
          # The probe writes its report and its captured streams under the
          # prefix it is given, so the same program runs against the
          # image's library and against the pinned one.
          cat > /tmp/readline_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          extern char *readline(const char *);
          extern int rl_readline_version;

          int main(int argc, char **argv) {
              const char *prefix = argc > 1 ? argv[1] : "/tmp/readline_probe";
              char report_path[512];
              char out_path[512];
              char err_path[512];
              snprintf(report_path, sizeof report_path, "%s.report", prefix);
              snprintf(out_path, sizeof out_path, "%s.out", prefix);
              snprintf(err_path, sizeof err_path, "%s.err", prefix);
              FILE *report = fopen(report_path, "w");
              if (!report) {
                  return 1;
              }
              setvbuf(report, NULL, _IONBF, 0);
              fprintf(report, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              freopen(out_path, "w", stdout);
              freopen(err_path, "w", stderr);
              char *line = readline("probe> ");
              free(line);
              fflush(stdout);
              fflush(stderr);
              char buffer[512];
              size_t read = 0;
              FILE *out = fopen(out_path, "r");
              if (out) {
                  read = fread(buffer, 1, sizeof(buffer) - 1, out);
                  fclose(out);
              }
              buffer[read] = '\0';
              fprintf(report, "prompt_in_stdout=%d\n", strstr(buffer, "probe>") != NULL);
              fclose(report);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_probe_image /tmp/readline_probe.c -lreadline
          echo "" | /tmp/readline_probe_image /tmp/readline_probe_image || true
          cat /tmp/readline_probe_image.report
          version=$(dpkg-query -W -f='${Version}' libreadline-dev)
          echo "readline_package_version=$version"
          # The library the probe links is the image's own library, the one
          # the claim was measured on; the oracle host loads the pinned
          # release, and the oracle suite names the release it carries.
          release=$(sed -n 's/^readline_release=//p' /tmp/readline_probe_image.report)
          echo "readline_release=$release"
          case "$release" in
            8.2)
              # The claim, on the release it was observed on: the library
              # writes its prompt to standard output.
              grep -qx 'prompt_in_stdout=1' /tmp/readline_probe_image.report
              ;;
            *)
              # Another release is an observation, not a check of the claim.
              cat /tmp/readline_probe_image.report
              echo "::warning::the runner image's Readline is $release; the compatibility row's claim was observed on 8.2"
              ;;
          esac
      - name: Check the output-stream claim on the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The claim the compatibility row makes is about the release the
          # document targets, so the probe runs against the pinned release
          # too and the claim is checked there, not only observed on the
          # 8.2 release the runner image ships.
          cc -o /tmp/readline_probe_pinned /tmp/readline_probe.c \
            -L"$readline/lib" -Wl,-rpath,"$readline/lib" -lreadline
          echo "" | /tmp/readline_probe_pinned /tmp/readline_probe_pinned || true
          cat /tmp/readline_probe_pinned.report
          # The probe has to link the pinned release, not the image's
          # library, or the check repeats the observation above.
          env -u SHELLOPTS ldd /tmp/readline_probe_pinned | grep -F "$readline/lib/libreadline"
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/readline_probe_pinned.report
          grep -qx 'prompt_in_stdout=1' /tmp/readline_probe_pinned.report
      - name: Measure literal prompt handling against the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The prompt contract is a Readline library behavior, not Bash's
          # expansion of PS1, so call readline(prompt) directly in a program
          # linked to the exact pinned release. This records byte behavior
          # for literal shell-looking sequences and Readline's own markers.
          cat > /tmp/readline_prompt_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <readline/readline.h>

          extern int rl_readline_version;

          int main(void) {
              const char *prompt = getenv("SUSHLINE_PROMPT_PROBE");
              if (prompt == NULL)
                  return 2;
              fprintf(stderr, "readline_release=%d.%d\n", rl_readline_version >> 8,
                      rl_readline_version & 0xff);
              char *line = readline(prompt);
              free(line);
              return 0;
          }
          PROBE
          cc -o /tmp/readline_prompt_probe /tmp/readline_prompt_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -lreadline
          # The loader must resolve every Readline library from the pinned
          # prefix. The runtime release number below independently checks the
          # code that answered readline(prompt).
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_prompt_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the prompt probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the prompt probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          python3 - <<'PYPROBE'
          import os
          import subprocess

          fixtures = [
              ("literal_backslash_e", b"A\\eB> ", b"A\\eB> \n"),
              ("literal_octal", b"A\\101B> ", b"A\\101B> \n"),
              ("literal_brackets", b"A\\[\\e[31m\\]B> ", b"A\\[\\e[31m\\]B> \n"),
              ("readline_invisible_markers", b"A\x01\x1b[31m\x02B> ", b"A\x1b[31mB> \n"),
          ]
          expected_release = os.environ["READLINE_ORACLE_VERSION"]
          for label, prompt, expected in fixtures:
              env = os.environ.copy()
              env["INPUTRC"] = "/dev/null"
              env["LC_ALL"] = "C"
              env["SUSHLINE_PROMPT_PROBE"] = prompt.decode("latin-1")
              result = subprocess.run(
                  ["/tmp/readline_prompt_probe"],
                  input=b"\n",
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  env=env,
              )
              release_report = f"readline_release={expected_release}\n".encode()
              print(
                  f"{label}: returncode={result.returncode} "
                  f"release={result.stderr.decode('ascii', 'replace').strip()} "
                  f"prompt_hex={result.stdout.hex()}"
              )
              if result.returncode != 0 or result.stderr != release_report:
                  raise SystemExit(f"{label}: expected {release_report!r}, got {result.stderr!r}")
              if result.stdout != expected:
                  raise SystemExit(f"{label}: expected prompt bytes {expected.hex()}, got {result.stdout.hex()}")
          PYPROBE
      - name: Measure synthetic CS7 termios preparation against the pinned release
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # Linux PTYs can normalize CS7 to CS8. Interpose the termios boundary
          # instead: this measures library requests from synthetic input, NOT
          # live PTY behavior or kernel acceptance of CS7. No input is read.
          # Each case runs in a fresh process, with initialization excluded.
          cat > /tmp/readline_termios_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <termios.h>
          #include <readline/readline.h>

          /* This boundary is synthetic: no kernel tty attributes are read or changed. */
          static struct termios attributes;
          static const char *phase = "initialize";
          static unsigned gets, sets;

          static void report(const char *label, const struct termios *t) {
              printf("%s iflag=0x%lx oflag=0x%lx cflag=0x%lx lflag=0x%lx "
                     "CSIZE=0x%lx ISTRIP=%d INPCK=%d\n", label,
                     (unsigned long)t->c_iflag, (unsigned long)t->c_oflag,
                     (unsigned long)t->c_cflag, (unsigned long)t->c_lflag,
                     (unsigned long)(t->c_cflag & CSIZE),
                     !!(t->c_iflag & ISTRIP), !!(t->c_iflag & INPCK));
          }

          int tcgetattr(int fd, struct termios *t) {
              if (fd != fileno(rl_instream)) {
                  fprintf(stderr, "unexpected tcgetattr fd=%d\n", fd);
                  exit(1);
              }
              ++gets;
              *t = attributes;
              if (strcmp(phase, "initialize") != 0) {
                  printf("phase=%s ", phase);
                  report("supplied", t);
              }
              return 0;
          }

          int tcsetattr(int fd, int action, const struct termios *t) {
              if (fd != fileno(rl_instream)) {
                  fprintf(stderr, "unexpected tcsetattr fd=%d\n", fd);
                  exit(1);
              }
              ++sets;
              if (strcmp(phase, "initialize") != 0) {
                  printf("phase=%s tcsetattr_action=%d ", phase, action);
                  report("requested", t);
              }
              attributes = *t;
              return 0;
          }

          int main(int argc, char **argv) {
              if (argc != 3 || (strcmp(argv[1], "CS7") && strcmp(argv[1], "CS8")) ||
                  (strcmp(argv[2], "0") && strcmp(argv[2], "1")))
                  return 2;
              struct termios input = {0};
              input.c_iflag = ISTRIP | INPCK | ICRNL | IXON;
              input.c_oflag = OPOST | ONLCR;
              input.c_cflag = CREAD | (strcmp(argv[1], "CS7") == 0 ? CS7 : CS8);
              input.c_lflag = ECHO | ICANON | ISIG | IEXTEN;
              input.c_cc[VMIN] = 1;
              input.c_cc[VTIME] = 0;
              attributes = input;
              rl_instream = stdin;
              rl_outstream = fopen("/dev/null", "w");
              if (!rl_outstream)
                  return 1;
              printf("readline_release=%d.%d\n", rl_readline_version >> 8,
                     rl_readline_version & 0xff);
              printf("boundary=synthetic-termios case=%s meta_flag=%s\n", argv[1], argv[2]);
              if (rl_initialize() != 0 || rl_variable_bind("enable-meta-key", "on") != 0)
                  return 1;
              printf("initialize_gets=%u initialize_sets=%u (excluded from preparation)\n", gets, sets);
              /* Initialization may query/change the boundary. Seed again only now. */
              attributes = input;
              gets = sets = 0;
              phase = "prepare";
              report("input", &input);
              rl_prep_terminal(atoi(argv[2]));
              printf("prepare_gets=%u prepare_sets=%u\n", gets, sets);
              if (gets == 0 || sets == 0) {
                  fprintf(stderr, "preparation did not use the interposed termios boundary\n");
                  return 1;
              }
              gets = sets = 0;
              phase = "restore";
              rl_deprep_terminal();
              printf("restore_gets=%u restore_sets=%u\n", gets, sets);
              if (sets == 0 || attributes.c_iflag != input.c_iflag ||
                  attributes.c_oflag != input.c_oflag || attributes.c_cflag != input.c_cflag ||
                  attributes.c_lflag != input.c_lflag ||
                  memcmp(attributes.c_cc, input.c_cc, sizeof input.c_cc) != 0) {
                  fprintf(stderr, "restoration did not return the synthetic input\n");
                  return 1;
              }
              fclose(rl_outstream);
              return 0;
          }
          PROBE
          cc -Wall -Wextra -Werror -o /tmp/readline_termios_probe /tmp/readline_termios_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,-rpath,"$readline/lib" -Wl,--export-dynamic -lreadline
          loader_report=$(env -u SHELLOPTS ldd /tmp/readline_termios_probe)
          echo "$loader_report"
          readline_libraries=$(printf '%s\n' "$loader_report" | grep 'libreadline' || true)
          if [ -z "$readline_libraries" ]; then
            echo "the termios probe loaded no Readline library" >&2
            exit 1
          fi
          if printf '%s\n' "$readline_libraries" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the termios probe loaded Readline outside the pinned prefix" >&2
            exit 1
          fi
          # Assert the boundary, restoration and release identity, then pin
          # requested flags to repeated measurements from the exact target
          # release rather than values inferred from another version.
          : > /tmp/readline_termios.out
          for fixture in 'CS8 0' 'CS7 0' 'CS7 1'; do
            read -r size meta_flag <<< "$fixture"
            report=$(env INPUTRC=/dev/null LC_ALL=C TERM=dumb \
              /tmp/readline_termios_probe "$size" "$meta_flag" < /dev/null)
            printf '%s\n' "$report" | tee -a /tmp/readline_termios.out
            release=$(printf '%s\n' "$report" | sed -n 's/^readline_release=//p')
            test "$release" = "$READLINE_ORACLE_VERSION"
          done
          while IFS= read -r expected; do
            grep -Fqx "$expected" /tmp/readline_termios.out || {
              echo "pinned termios mismatch: $expected" >&2
              exit 1
            }
          done <<'EXPECTED'
          phase=prepare tcsetattr_action=1 requested iflag=0x400 oflag=0x5 cflag=0xb0 lflag=0x8001 CSIZE=0x30 ISTRIP=0 INPCK=0
          phase=prepare tcsetattr_action=1 requested iflag=0x430 oflag=0x5 cflag=0xa0 lflag=0x8001 CSIZE=0x20 ISTRIP=1 INPCK=1
          phase=prepare tcsetattr_action=1 requested iflag=0x400 oflag=0x5 cflag=0xa0 lflag=0x8001 CSIZE=0x20 ISTRIP=0 INPCK=0
          EXPECTED
      - name: Measure the pinned release's history range bounds
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # The compatibility row's file-range claim rests on a measurement of
          # GNU's own range call, so the measurement is repeated here against
          # the pinned release and the row's claim is checked there. The probe
          # asks the library for the entries a range selects, which is the
          # behavior the row describes.
          cat > /tmp/history_range_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <readline/history.h>

          static void show(const char *label) {
              HIST_ENTRY **entries = history_list();
              printf("%s:", label);
              if (entries == NULL) {
                  printf(" (none)\n");
                  return;
              }
              for (int i = 0; entries[i] != NULL; i++) {
                  printf(" {");
                  for (const char *p = entries[i]->line; p != NULL && *p; p++) {
                      if (*p == '\n') {
                          printf("\\n");
                      } else {
                          putchar(*p);
                      }
                  }
                  printf("}");
              }
              printf("\n");
          }

          int main(int argc, char **argv) {
              const char *path = argv[1];
              int from = atoi(argv[2]);
              int to = atoi(argv[3]);
              int multiline = atoi(argv[4]);
              history_multiline_entries = multiline;
              using_history();
              clear_history();
              read_history_range(path, from, to);
              char label[64];
              snprintf(label, sizeof label, "multiline=%d from=%d to=%d", multiline, from, to);
              show(label);
              return 0;
          }
          PROBE
                    # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked which
          # library answered the calls. The runpath is written as the older
          # DT_RPATH, which a dependency inherits, so the pinned readline
          # library's own history dependency is resolved inside the prefix
          # and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_range_probe /tmp/history_range_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the check repeats an observation made elsewhere.
          # The loader's report has to name the pinned prefix for the
          # libraries that carry the history code, and to name nothing else
          # for them either, so a call answered by the image's history
          # library stops the job. The runpath is written as the older
          # DT_RPATH, which a dependency inherits, so the pinned library's own
          # dependency is resolved inside the prefix as well.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_range_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the history probe loaded no readline or history library" >&2
            exit 1
          fi
          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the history probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          printf '#1700000000\nA0\nA1\n#1700000001\nB0\nB1\nB2\n' > /tmp/history_range_fixture
          # The bounds count the file's command lines and the selected lines
          # are grouped afterwards, so a range can end with a partial block.
          /tmp/history_range_probe /tmp/history_range_fixture 0 3 0 | tee /tmp/history_range_per_line.out
          grep -qx 'multiline=0 from=0 to=3: {A0} {A1} {B0}' /tmp/history_range_per_line.out
          /tmp/history_range_probe /tmp/history_range_fixture 0 3 1 | tee /tmp/history_range_joined.out
          grep -qx 'multiline=1 from=0 to=3: {A0\\nA1} {B0}' /tmp/history_range_joined.out
          # The same measurement on a file whose lines are all commands, and
          # on a file that begins with a command line and holds a timestamp
          # record later, which are the cases the compatibility document
          # names as the ones where this library and GNU differ.
          printf 'C0\nC1\nC2\nC3\n' > /tmp/history_range_plain
          printf 'A0\n#1700000000\nB0\n' > /tmp/history_range_late_record
          /tmp/history_range_probe /tmp/history_range_plain 0 3 1 | tee /tmp/history_range_plain_joined.out
          grep -qx 'multiline=1 from=0 to=3: {C0\\nC1\\nC2}' /tmp/history_range_plain_joined.out
          /tmp/history_range_probe /tmp/history_range_late_record 0 3 0 | tee /tmp/history_range_late_record.out
          grep -qx 'multiline=0 from=0 to=3: {A0} {#1700000000} {B0}' /tmp/history_range_late_record.out
          # Both timestamped grouping modes show the blank consumes a bound;
          # compare the same physical lines without timestamp records as well.
          printf '#1700000000\nA0\n\nA1\n#1700000001\nB0\nB1\n' > /tmp/history_range_blank_lines
          /tmp/history_range_probe /tmp/history_range_blank_lines 0 3 0 | tee /tmp/history_range_blank_lines.out
          grep -qx 'multiline=0 from=0 to=3: {A0} {A1}' /tmp/history_range_blank_lines.out
          /tmp/history_range_probe /tmp/history_range_blank_lines 0 3 1 | tee /tmp/history_range_blank_lines_joined.out
          grep -qx 'multiline=1 from=0 to=3: {A0\\n\\nA1}' /tmp/history_range_blank_lines_joined.out
          printf 'A0\n\nA1\nB0\nB1\n' > /tmp/history_range_plain_blank_lines
          /tmp/history_range_probe /tmp/history_range_plain_blank_lines 0 3 0 | tee /tmp/history_range_plain_blank_lines.out
          grep -qx 'multiline=0 from=0 to=3: {A0} {A1}' /tmp/history_range_plain_blank_lines.out
          /tmp/history_range_probe /tmp/history_range_plain_blank_lines 0 3 1 | tee /tmp/history_range_plain_blank_lines_joined.out
          grep -qx 'multiline=1 from=0 to=3: {A0\\n\\nA1}' /tmp/history_range_plain_blank_lines_joined.out
          # These pinned GNU 8.3 answers are asserted for the blank-line
          # edge fixtures; the compatibility document scopes each result.
          {
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 1 0
            /tmp/history_range_probe /tmp/history_range_blank_lines 2 1 0
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 0 0
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 2 0
          } | tee /tmp/history_range_blank_line_edges_timestamped.out
          grep -qx 'multiline=0 from=1 to=1: (none)' /tmp/history_range_blank_line_edges_timestamped.out
          grep -qx 'multiline=0 from=2 to=1: {A1}' /tmp/history_range_blank_line_edges_timestamped.out
          grep -qx 'multiline=0 from=1 to=0: (none)' /tmp/history_range_blank_line_edges_timestamped.out
          grep -qx 'multiline=0 from=1 to=2: (none)' /tmp/history_range_blank_line_edges_timestamped.out
          {
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 1 0
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 2 1 0
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 0 0
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 2 0
          } | tee /tmp/history_range_blank_line_edges_plain.out
          grep -qx 'multiline=0 from=1 to=1: (none)' /tmp/history_range_blank_line_edges_plain.out
          grep -qx 'multiline=0 from=2 to=1: {A1}' /tmp/history_range_blank_line_edges_plain.out
          grep -qx 'multiline=0 from=1 to=0: (none)' /tmp/history_range_blank_line_edges_plain.out
          grep -qx 'multiline=0 from=1 to=2: (none)' /tmp/history_range_blank_line_edges_plain.out
          # Assert pinned GNU 8.3 joined-mode results for the same boundaries.
          {
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 1 1
            /tmp/history_range_probe /tmp/history_range_blank_lines 2 1 1
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 0 1
            /tmp/history_range_probe /tmp/history_range_blank_lines 1 2 1
          } | tee /tmp/history_range_blank_line_edges_joined_timestamped.out
          grep -qx 'multiline=1 from=1 to=1: {}' /tmp/history_range_blank_line_edges_joined_timestamped.out
          grep -qx 'multiline=1 from=2 to=1: {A1}' /tmp/history_range_blank_line_edges_joined_timestamped.out
          grep -qx 'multiline=1 from=1 to=0: {}' /tmp/history_range_blank_line_edges_joined_timestamped.out
          grep -qx 'multiline=1 from=1 to=2: {}' /tmp/history_range_blank_line_edges_joined_timestamped.out
          {
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 1 1
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 2 1 1
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 0 1
            /tmp/history_range_probe /tmp/history_range_plain_blank_lines 1 2 1
          } | tee /tmp/history_range_blank_line_edges_joined_plain.out
          grep -qx 'multiline=1 from=1 to=1: {}' /tmp/history_range_blank_line_edges_joined_plain.out
          grep -qx 'multiline=1 from=2 to=1: {A1}' /tmp/history_range_blank_line_edges_joined_plain.out
          grep -qx 'multiline=1 from=1 to=0: {}' /tmp/history_range_blank_line_edges_joined_plain.out
          grep -qx 'multiline=1 from=1 to=2: {}' /tmp/history_range_blank_line_edges_joined_plain.out
          # The installed GNU 8.2 measurements differ from the product's
          # equal and reversed-bound rules; retain the pinned 8.3 answers.
          {
            /tmp/history_range_probe /tmp/history_range_fixture 0 0 0
            /tmp/history_range_probe /tmp/history_range_fixture 2 2 0
            /tmp/history_range_probe /tmp/history_range_fixture 2 1 0
          } | tee /tmp/history_range_edge_timestamped.out
          grep -qx 'multiline=0 from=0 to=0: (none)' /tmp/history_range_edge_timestamped.out
          grep -qx 'multiline=0 from=2 to=2: (none)' /tmp/history_range_edge_timestamped.out
          grep -qx 'multiline=0 from=2 to=1: (none)' /tmp/history_range_edge_timestamped.out
          {
            /tmp/history_range_probe /tmp/history_range_plain 0 0 0
            /tmp/history_range_probe /tmp/history_range_plain 2 2 0
            /tmp/history_range_probe /tmp/history_range_plain 2 1 0
          } | tee /tmp/history_range_edge_plain.out
          grep -qx 'multiline=0 from=0 to=0: {C0}' /tmp/history_range_edge_plain.out
          grep -qx 'multiline=0 from=2 to=2: {C2}' /tmp/history_range_edge_plain.out
          grep -qx 'multiline=0 from=2 to=1: {C2}' /tmp/history_range_edge_plain.out
          # Measure bounds beyond EOF without asserting an inferred result;
          # retain the pinned GNU 8.3 answers for inspection.
          {
            /tmp/history_range_probe /tmp/history_range_fixture 5 9 0
            /tmp/history_range_probe /tmp/history_range_fixture 3 9 0
          } | tee /tmp/history_range_oob_timestamped.out
          {
            /tmp/history_range_probe /tmp/history_range_plain 4 9 0
            /tmp/history_range_probe /tmp/history_range_plain 2 9 0
          } | tee /tmp/history_range_oob_plain.out
          grep -qx 'multiline=0 from=5 to=9: (none)' /tmp/history_range_oob_timestamped.out
          grep -qx 'multiline=0 from=3 to=9: {B1} {B2}' /tmp/history_range_oob_timestamped.out
          grep -qx 'multiline=0 from=4 to=9: (none)' /tmp/history_range_oob_plain.out
          grep -qx 'multiline=0 from=2 to=9: {C2} {C3}' /tmp/history_range_oob_plain.out
      - name: Measure the pinned release's full-file late timestamp rule
        run: |
          set -euo pipefail
          readline="$HOME/.cache/sushline/readline-oracle"
          # Measurement-only full-file companion to the range probe: the
          # fixture begins with an ordinary command and holds a `#`-plus-digits
          # line later, which the compatibility document names as the case
          # where this library and GNU differ. The probe calls GNU's own
          # full-file `read_history` and reports the exact entry text and
          # count. No value inferred from another release is asserted here;
          # the pinned 8.3 output is compared below with the Rust full-file
          # baseline. Library semantics only, not shell or C ABI
          # claims.
          cat > /tmp/history_full_probe.c <<'PROBE'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <readline/history.h>

          extern int rl_readline_version;

          int main(int argc, char **argv) {
              int show_timestamps = 0;
              int multiline_mode = 0;
              if (argc < 2 || argc > 4) {
                  return 2;
              }
              for (int i = 2; i < argc; i++) {
                  if (strcmp(argv[i], "--timestamp") == 0) {
                      show_timestamps = 1;
                  } else if (strcmp(argv[i], "--mode") == 0 && i + 1 < argc &&
                             (strcmp(argv[i + 1], "0") == 0 || strcmp(argv[i + 1], "1") == 0)) {
                      multiline_mode = argv[++i][0] - '0';
                  } else {
                      return 2;
                  }
              }
              printf("readline_release=%d.%d\n", rl_readline_version >> 8,
                     rl_readline_version & 0xff);
              printf("history_multiline_entries=%d\n", multiline_mode);
              history_multiline_entries = multiline_mode;
              using_history();
              clear_history();
              if (read_history(argv[1]) != 0) {
                  printf("read_history_status=failed\n");
                  return 1;
              }
              printf("read_history_status=ok\n");
              HIST_ENTRY **entries = history_list();
              int count = 0;
              if (entries != NULL) {
                  while (entries[count] != NULL) {
                      count++;
                  }
              }
              printf("entry_count=%d\n", count);
              if (show_timestamps) {
                  printf("history_comment_char=%u\n", (unsigned char) history_comment_char);
                  if (entries != NULL) {
                      for (int i = 0; entries[i] != NULL; i++) {
                          printf("timestamp_%d_hex=", i);
                          if (entries[i]->timestamp != NULL) {
                              for (const unsigned char *p =
                                       (const unsigned char *) entries[i]->timestamp;
                                   *p != 0; p++) {
                                  printf("%02x", *p);
                              }
                          } else {
                              printf("none");
                          }
                          printf("\nparsed_time_%d=%lld\n", i,
                                 (long long) history_get_time(entries[i]));
                      }
                  }
              }
              if (entries != NULL) {
                  for (int i = 0; entries[i] != NULL; i++) {
                      printf("entry_%d=", i);
                      for (const char *p = entries[i]->line; p != NULL && *p; p++) {
                          if (*p == '\n') {
                              printf("\\n");
                          } else {
                              putchar(*p);
                          }
                      }
                      printf("\n");
                  }
              }
              return 0;
          }
          PROBE
          # The probe calls the history library, which the release ships as
          # its own library beside the readline one, so the link names it
          # when the pinned build produced one, and the loader is asked which
          # library answered the calls. The runpath is written as the older
          # DT_RPATH, which a dependency inherits, so the pinned readline
          # library's own history dependency is resolved inside the prefix
          # and not from the image.
          history_libraries=(-lreadline)
          if [ -e "$readline/lib/libhistory.so" ]; then
            history_libraries+=(-lhistory)
          fi
          cc -o /tmp/history_full_probe /tmp/history_full_probe.c \
            -I"$readline/include" -L"$readline/lib" \
            -Wl,--no-as-needed -Wl,--disable-new-dtags -Wl,-rpath,"$readline/lib" \
            "${history_libraries[@]}"
          # The probe has to link the pinned release, not the image's
          # library, or the measurement repeats an observation made elsewhere.
          # The loader's report has to name the pinned prefix for the
          # libraries that carry the history code, and to name nothing else
          # for them either, so a call answered by the image's history
          # library stops the job.
          loader_report=$(env -u SHELLOPTS ldd /tmp/history_full_probe)
          echo "$loader_report"
          history_libraries_in_report=$(printf '%s\n' "$loader_report" | grep -E 'lib(readline|history)' || true)
          if [ -z "$history_libraries_in_report" ]; then
            echo "the full-file probe loaded no readline or history library" >&2
            exit 1
          fi
          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the full-file probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          # The same bounded bytes the Rust baseline reads: a file that begins
          # with an ordinary command and holds a `#`-plus-digits line later.
          printf 'A0\n#1700000000\nB0\n' > /tmp/history_full_late_record
          /tmp/history_full_probe /tmp/history_full_late_record | tee /tmp/history_full_late_record.out
          # Pin the direct-library result for this late marker in an
          # otherwise plain file; the matching Rust test asserts its own
          # entries and timestamp fields.
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_late_record.out
          grep -qx 'history_multiline_entries=0' /tmp/history_full_late_record.out
          grep -qx 'read_history_status=ok' /tmp/history_full_late_record.out
          grep -qx 'entry_count=3' /tmp/history_full_late_record.out
          grep -qx 'entry_0=A0' /tmp/history_full_late_record.out
          grep -qx 'entry_1=#1700000000' /tmp/history_full_late_record.out
          grep -qx 'entry_2=B0' /tmp/history_full_late_record.out
          # Keep binary input as bytes: these fixtures pin the observed GNU
          # History 8.3 treatment of embedded NULs and later physical lines.
          printf 'one\000hidden\nnext\000tail\nfinal\n' > /tmp/history_full_nul_plain
          /tmp/history_full_probe /tmp/history_full_nul_plain | tee /tmp/history_full_nul_plain.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_plain.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_plain.out
          grep -qx 'entry_count=3' /tmp/history_full_nul_plain.out
          grep -qx 'entry_0=one' /tmp/history_full_nul_plain.out
          grep -qx 'entry_1=next' /tmp/history_full_nul_plain.out
          grep -qx 'entry_2=final' /tmp/history_full_nul_plain.out
          printf '\000hidden\nnext\n' > /tmp/history_full_nul_leading
          /tmp/history_full_probe /tmp/history_full_nul_leading | tee /tmp/history_full_nul_leading.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_leading.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_leading.out
          grep -qx 'entry_count=1' /tmp/history_full_nul_leading.out
          grep -qx 'entry_0=next' /tmp/history_full_nul_leading.out
          # Pin full-file blank-line outputs in both History multiline modes.
          printf '#1700000000\n\nA\n#1700000001\n\n\n#1700000002\nB\n\n' > /tmp/history_full_blank_timestamped
          printf '\nA\n\n\nB\n\n\nC\n\n' > /tmp/history_full_blank_plain
          /tmp/history_full_probe /tmp/history_full_blank_timestamped --mode 0 | tee /tmp/history_full_blank_timestamped_mode0.out
          /tmp/history_full_probe /tmp/history_full_blank_timestamped --mode 1 | tee /tmp/history_full_blank_timestamped_mode1.out
          /tmp/history_full_probe /tmp/history_full_blank_plain --mode 0 | tee /tmp/history_full_blank_plain_mode0.out
          /tmp/history_full_probe /tmp/history_full_blank_plain --mode 1 | tee /tmp/history_full_blank_plain_mode1.out
          for report in /tmp/history_full_blank_*.out; do
            grep -qx "readline_release=$READLINE_ORACLE_VERSION" "$report"
            grep -qx 'read_history_status=ok' "$report"
          done
          grep -qx 'history_multiline_entries=0' /tmp/history_full_blank_timestamped_mode0.out
          grep -qx 'entry_count=2' /tmp/history_full_blank_timestamped_mode0.out
          grep -qx 'entry_0=A' /tmp/history_full_blank_timestamped_mode0.out
          grep -qx 'entry_1=B' /tmp/history_full_blank_timestamped_mode0.out
          grep -qx 'history_multiline_entries=1' /tmp/history_full_blank_timestamped_mode1.out
          grep -qx 'entry_count=2' /tmp/history_full_blank_timestamped_mode1.out
          grep -qx 'entry_0=A' /tmp/history_full_blank_timestamped_mode1.out
          grep -Fqx 'entry_1=B\n' /tmp/history_full_blank_timestamped_mode1.out
          grep -qx 'history_multiline_entries=0' /tmp/history_full_blank_plain_mode0.out
          grep -qx 'entry_count=3' /tmp/history_full_blank_plain_mode0.out
          grep -qx 'entry_0=A' /tmp/history_full_blank_plain_mode0.out
          grep -qx 'entry_1=B' /tmp/history_full_blank_plain_mode0.out
          grep -qx 'entry_2=C' /tmp/history_full_blank_plain_mode0.out
          grep -qx 'history_multiline_entries=1' /tmp/history_full_blank_plain_mode1.out
          grep -qx 'entry_count=1' /tmp/history_full_blank_plain_mode1.out
          grep -Fqx 'entry_0=\nA\n\n\nB\n\n\nC\n' /tmp/history_full_blank_plain_mode1.out
          printf '#1700000000\none\000hidden\n#1700000001\nnext\000tail\nfinal\n' > /tmp/history_full_nul_timestamped
          /tmp/history_full_probe /tmp/history_full_nul_timestamped | tee /tmp/history_full_nul_timestamped.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_full_nul_timestamped.out
          grep -qx 'read_history_status=ok' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_count=3' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_0=one' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_1=next' /tmp/history_full_nul_timestamped.out
          grep -qx 'entry_2=final' /tmp/history_full_nul_timestamped.out
          # A NUL inside the timestamp metadata line is measured separately:
          # retain each entry's raw/parsed timestamp and the command list.
          printf '#1700000000\000suffix\nalpha\nbeta\n' > /tmp/history_timestamp_nul
          /tmp/history_full_probe /tmp/history_timestamp_nul --timestamp | tee /tmp/history_timestamp_nul.out
          grep -qx "readline_release=$READLINE_ORACLE_VERSION" /tmp/history_timestamp_nul.out
          grep -qx 'read_history_status=ok' /tmp/history_timestamp_nul.out
          grep -qx 'entry_count=2' /tmp/history_timestamp_nul.out
          grep -qx 'history_comment_char=0' /tmp/history_timestamp_nul.out
          grep -qx 'timestamp_0_hex=2331373030303030303030' /tmp/history_timestamp_nul.out
          grep -qx 'parsed_time_0=0' /tmp/history_timestamp_nul.out
          grep -Eq '^timestamp_1_hex=23(3[0-9])+$' /tmp/history_timestamp_nul.out
          grep -qx 'parsed_time_1=0' /tmp/history_timestamp_nul.out
          grep -qx 'entry_0=alpha' /tmp/history_timestamp_nul.out
          grep -qx 'entry_1=beta' /tmp/history_timestamp_nul.out
