[package]
name = "sushline"
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure Rust Readline-style line editing and history for Sush"

[workspace]
members = ["history", "readline"]
resolver = "3"

[dependencies]
# The version requirements let the crates be packaged: a path dependency
# without a version cannot be published.
history = { package = "sushline-history", path = "history", version = "0.1.0" }
# The default features of `readline` only gate its Bash-hosted test targets,
# so the facade opts out of them and keeps the dependency surface explicit.
readline = { package = "sushline-readline", path = "readline", version = "0.1.0", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
