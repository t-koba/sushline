          if printf '%s\n' "$history_libraries_in_report" | grep -v -F "$readline/lib/" > /dev/null; then
            echo "the position probe loaded a readline or history library outside the pinned prefix" >&2
            exit 1
          fi
          # The rules the rows record: the entries are numbered from one, so
          # position 0 holds no entry and position 1 holds the first, and the
          # two integers of history_search_pos are read as the direction
          # first and the position second, with the position included in
          # the search.
          /tmp/history_position_probe | tee /tmp/history_position.out
          grep -qx 'get_zero: (null)' /tmp/history_position.out
          grep -qx 'get_one: alpha' /tmp/history_position.out
          grep -qx 'get_two: beta' /tmp/history_position.out
          grep -qx 'backwards_from_first: -1' /tmp/history_position.out
          grep -qx 'forwards_from_first: 2' /tmp/history_position.out
          grep -qx 'from_first: 0' /tmp/history_position.out
          grep -qx 'from_second: 2' /tmp/history_position.out
          # Run each append fixture in its own process so prior navigation
          # cannot affect the position being measured. These outputs are
          # retained for exact GNU 8.3 review; Rust expectations live in the
          # History unit test and are not used to assert GNU's result here.
          /tmp/history_position_probe middle | tee /tmp/history_position_append.out
          /tmp/history_position_probe end | tee -a /tmp/history_position_append.out
          /tmp/history_position_probe init | tee -a /tmp/history_position_append.out
          # The stifled fixtures are asserted independently of the Rust tests.
          # Each process starts fresh; the retained artifact includes both
          # the pre-eviction list and the resulting numeric position.
          for fixture in stifle0 stifle1 stifle1-end stifle2-seq stifle2-0 stifle2-1 stifle2-2; do
            /tmp/history_position_probe "$fixture" | tee -a /tmp/history_position_append.out
          done
          grep '^stifle' /tmp/history_position_append.out > /tmp/history_position_stifled.out
          cat > /tmp/history_position_stifled.expected <<'EXPECTED'
