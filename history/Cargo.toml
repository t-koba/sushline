[package]
name = "sushline-history"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "History library for sushline"

[lib]
name = "history"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
